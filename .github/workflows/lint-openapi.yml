name: Validación OpenAPI (CI)

on:
  push:
    branches: [main]
    paths:
      - 'docs/api/**'
      - 'redocly.yaml'
      - '.github/workflows/lint-openapi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/api/**'
      - 'redocly.yaml'

jobs:
  validate-specs:
    name: Validar contratos OpenAPI 3.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar validador oficial de OpenAPI
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml openapi-spec-validator

      - name: Validar estructura (openapi-spec-validator)
        run: |
          python - <<'EOF'
          import yaml
          from openapi_spec_validator import validate
          for ruta in ("docs/api/openapi-intranet.yaml", "docs/api/openapi-web.yaml"):
              with open(ruta, encoding="utf-8") as f:
                  validate(yaml.safe_load(f))
              print(f"OK {ruta}")
          EOF

      - name: Lint de buenas prácticas (Redocly)
        run: npx --yes @redocly/cli@2.79.0 lint docs/api/openapi-intranet.yaml docs/api/openapi-web.yaml
