# Entorno de desarrollo de la intranet.
#   cp .env.example .env
#   docker compose up --build
# API: http://localhost:8000   ·   Documentación interactiva: http://localhost:8000/docs

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"   # solo accesible desde este ordenador
    volumes:
      - mongo_datos:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  intranet-api:
    build: ./intranet/backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de Docker los servicios se llaman por su nombre, no por localhost.
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # El código se monta para que los cambios se recarguen sin reconstruir la imagen.
      - ./intranet/backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_datos:
