        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    put:
      tags:
        - Retrasos
      summary: Corregir o actualizar registro de retraso
      description: Permite al profesor que anotó el retraso corregir los minutos o justificación.
      operationId: corregirRetraso
      security:
        - bearerAuth: []
      parameters:
        - name: retraso_id
          in: path
          required: true
          description: Identificador del retraso
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
