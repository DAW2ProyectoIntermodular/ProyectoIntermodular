          type: string
          nullable: true
          example: "El grupo estuvo realizando la práctica guiada número 4 sin incidentes."
        ausencia_origen_id:
          type: string
          nullable: true
          description: Identificador de la ausencia docente que provocó la guardia.
          example: "660e1d8f1b2c3d4e5f6a7b8e"
      required:
        - id
        - fecha
        - hueco_horario
        - dia_semana
        - aula_o_destino
        - docente_asignado_id
        - docente_asignado_nombre
        - docente_que_realiza_id
        - docente_que_realiza_nombre
        - tipo_guardia
        - estado

