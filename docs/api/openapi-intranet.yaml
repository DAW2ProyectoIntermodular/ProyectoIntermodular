                    example: 1
                  limit:
                    type: integer
                    example: 10
                  total:
                    type: integer
                    example: 15
                required:
                  - items
                  - page
                  - limit
                  - total
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'

