        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 20. AUDITORÍA (/api/v1/auditoria)
  # =========================================================================
  /api/v1/auditoria:
    get:
      tags:
        - Auditoría
      summary: Listar registros de auditoría y trazabilidad
      description: |
        Consulta el registro inmutable de acciones críticas (inicios de sesión, cambios de roles,
        modificaciones en guardias y calificaciones). Requiere rol `administrador`.
      operationId: listarAuditoria
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: query
          required: false
          description: Filtrar por usuario ejecutor
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
        - name: accion
          in: query
          required: false
          description: Tipo de acción ejecutada (p.ej. LOGIN, ROLES_UPDATE, GUARDIA_ASIGNADA)
          schema:
            type: string
            example: ROLES_UPDATE
        - name: fecha_desde
          in: query
          required: false
          description: Fecha de inicio de búsqueda (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-01"
        - name: fecha_hasta
          in: query
          required: false
          description: Fecha final de búsqueda (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-31"
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de registros de auditoría.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditoria'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '422':
          $ref: '#/components/responses/Respuesta422'

