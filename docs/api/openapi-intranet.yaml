          type: integer
          minimum: 1
          maximum: 7
          example: 3
        dia_semana:
          type: integer
          example: 4
        aula_o_destino:
          type: string
          example: "Aula 204 (1º DAW - Programación)"
        docente_asignado_id:
          type: string
          description: Docente seleccionado por el algoritmo de rondas según balance de contadores.
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        docente_asignado_nombre:
          type: string
          example: "Antonio Sánchez Lorente"
        docente_que_realiza_id:
          type: string
          description: Docente que realmente cubrió la guardia (puede diferir del asignado por sustitución).
          example: "660e1d8f1b2c3d4e5f6a7b8d"
        docente_que_realiza_nombre:
          type: string
          example: "María García Martínez"
        tipo_guardia:
          type: string
          enum: [aula, convivencia, biblioteca, recreo]
          example: "aula"
        estado:
          type: string
          enum: [pendiente, cubierta, no_cubierta]
          example: "cubierta"
