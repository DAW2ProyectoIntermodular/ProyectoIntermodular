      operationId: firmarPdfComision
      security:
        - bearerAuth: []
      parameters:
        - name: comision_id
          in: path
          required: true
          description: Identificador de la comisión
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmaDocumentoRequest'
      responses:
        '200':
          description: Comisión firmada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comision'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '409':
          description: La comisión ya está firmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 18. FEM - SEGUIMIENTO DE FORMACIÓN EN EMPRESAS (/api/v1/fem)
  # =========================================================================
  /api/v1/fem/empresas:
    get:
      tags:
        - FEM (Formación en Empresas)
      summary: Listar empresas colaboradoras de FEM
      description: |
        Consulta las entidades colaboradoras con convenio FCT / Formación en Empresa.
        Filtra por estado de colaboración (activa o inactiva), municipio y familia profesional o ciclo.
      operationId: listarEmpresasFEM
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Estado del convenio con la empresa
          schema:
            type: string
            enum: [activa, inactiva]
            example: activa
        - name: municipio
          in: query
          required: false
          description: Municipio de radicación de la empresa (p.ej. Totana, Lorca, Alhama, Murcia)
          schema:
            type: string
            example: Totana
        - name: ciclo_id
          in: query
          required: false
          description: Identificador del ciclo formativo
          schema:
            type: string
            example: CICLO-DAW2
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de empresas FEM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmpresasFEM'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - FEM (Formación en Empresas)
      summary: Registrar nueva empresa colaboradora de FEM
      description: |
        Da de alta una empresa colaboradora. La dirección física se geocodifica automáticamente
        mediante el servicio de Nominatim (OpenStreetMap) para obtener sus coordenadas latitud y longitud.
      operationId: crearEmpresaFEM
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaFEMCrear'
      responses:
        '201':
          description: Empresa registrada con éxito. Se incluye Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaFEM'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '409':
          description: Ya existe una empresa con ese CIF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/fem/empresas/{empresa_id}:
    get:
      tags:
        - FEM (Formación en Empresas)
      summary: Obtener detalle de empresa colaboradora
      description: Retorna la ficha técnica de la empresa, persona de contacto, convenios y coordenadas geográficas.
      operationId: obtenerEmpresaFEMPorId
      security:
        - bearerAuth: []
      parameters:
        - name: empresa_id
