        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - Tablón de Anuncios
      summary: Publicar nuevo anuncio
      description: |
        Crea una nueva comunicación en el tablón. Puede enviarse notificación push a los docentes suscritos
        si se marca como destacado. Devuelve `201 Created` y la cabecera `Location`.
      operationId: crearAnuncio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnuncioCrear'
      responses:
        '201':
          description: Anuncio publicado satisfactoriamente.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anuncio'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/anuncios/{anuncio_id}:
    get:
      tags:
        - Tablón de Anuncios
      summary: Obtener detalle de un anuncio
      description: Recupera el contenido completo de un anuncio.
      operationId: obtenerAnuncioPorId
      security:
        - bearerAuth: []
      parameters:
        - name: anuncio_id
          in: path
          required: true
          description: Identificador del anuncio
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Anuncio encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anuncio'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    put:
      tags:
        - Tablón de Anuncios
      summary: Actualizar anuncio completo
      description: Sustituye el contenido, título, caducidad y ámbito del anuncio. Solo autor o administrador.
      operationId: actualizarAnuncioCompleto
      security:
        - bearerAuth: []
      parameters:
        - name: anuncio_id
          in: path
          required: true
          description: Identificador del anuncio
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnuncioCrear'
      responses:
        '200':
          description: Anuncio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anuncio'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    patch:
      tags:
        - Tablón de Anuncios
      summary: Fijar destacado o actualizar caducidad de anuncio
      description: Permite fijar/desfijar como destacado o modificar la vigencia del anuncio sin tocar su contenido.
      operationId: modificarEstadoAnuncio
      security:
        - bearerAuth: []
      parameters:
        - name: anuncio_id
          in: path
          required: true
          description: Identificador del anuncio
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnuncioPatch'
      responses:
        '200':
          description: Estado del anuncio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anuncio'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
