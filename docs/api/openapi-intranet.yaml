openapi: 3.1.0
info:
  title: Intranet de Gestión Docente - IES Ramón Arcas Meca
  summary: API REST para la gestión integral académica, operativa y administrativa del centro docente.
  description: |
    ## Especificación OpenAPI 3.1 - Intranet de Gestión Docente
    **Centro:** IES Ramón Arcas Meca (Totana, Murcia)  
    **Ciclo Formativo:** 2º CFGS Desarrollo de Aplicaciones Web (DAW2) - Curso 2026/2027  
    **Proyecto:** Proyecto Intermodular - Producto 1 (Intranet Privada de Gestión Docente)

    ### Arquitectura del Sistema
    - **Backend:** FastAPI (Python 3.11+) con arquitectura limpia modular.
    - **Base de Datos Principal:** MongoDB (Motor NoSQL) para persistencia de usuarios, ausencias, guardias, horarios, tickets, aulas y auditoría.
    - **Caché y Tareas Asíncronas:** Redis para aceleración de consultas, sesiones y cola ligera de tareas en segundo plano.
    - **Generación de Documentos y Firma:** WeasyPrint / ReportLab para compilación de documentos PDF oficiales y firma manuscrita digitalizada (canvas) o electrónica (AutoFirma).
    - **Notificaciones:** Web Push API (Service Worker + pywebpush) y correo electrónico transaccional vía SMTP/fastapi-mail.
    - **Mapas y Geocodificación:** Leaflet + OpenStreetMap + Nominatim para el seguimiento geográfico de Formación en Empresas (FEM).
    - **Servicios Externos:** Google Workspace OAuth2 y Google Calendar API para sincronización bidireccional de horarios.

    ### Convenciones REST Obligatorias
    - **Versionado:** Todas las rutas incorporan el prefijo `/api/v1/`.
    - **Nomenclatura:** Rutas en español, sustantivos en plural y minúsculas separadas por guiones.
    - **Paginación uniforme:** Parámetros de consulta `?page=1&limit=10` (por defecto `page=1`, `limit=10`, máximo `50`).
      Respuesta paginada: `{"items": [...], "page": 1, "limit": 10, "total": N}`.
    - **Formato canónico de error:** `{"detail": "Mensaje explicativo del error"}`.
    - **Semántica de Verbos HTTP:**
      - `GET`: Consulta de recursos idempotente sin cuerpo de petición.
      - `POST`: Creación de recursos (`201 Created` con cabecera `Location` y objeto creado en el cuerpo) o ejecución de acciones operativas no CRUD como subrecursos.
      - `PUT`: Sustitución completa del recurso o colección.
      - `PATCH`: Modificación parcial (cambios de estado, autorizaciones, resoluciones).
      - `DELETE`: Eliminación lógica o física devolviendo `204 No Content`.
    - **Control de Acceso Basado en Roles (RBAC):** `profesor`, `administrador`, `jefatura_estudios`, `secretaria`, `responsable_rmi`, `admin_rrss`, `direccion`.
  version: 1.0.0
  contact:
    name: Equipo de Arquitectura DAW2 - IES Ramón Arcas Meca
    email: daw2@iesramonarcas.es
    url: https://iesramonarcas.es
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Servidor Local de Desarrollo (FastAPI + Uvicorn)
  - url: https://intranet.iesramonarcas.es
    description: Entorno de Producción Oficial - IES Ramón Arcas Meca

tags:
  - name: Autenticación
    description: Control de sesiones, autenticación federada con Google OAuth2 e intercambio de tokens JWT.
  - name: Usuarios
    description: Gestión del personal docente, perfiles de usuario, estados de alta y asignación de roles.
  - name: Departamentos
    description: Departamentos didácticos y de familias profesionales del centro.
  - name: Tablón de Anuncios
    description: Comunicación interna segmentada por departamento o ámbito general, con caducidad lógica y destacados.
  - name: Notificaciones
    description: Bandeja de notificaciones internas y suscripción a notificaciones push (Web Push API).
  - name: Publicaciones RRSS
    description: Solicitudes de difusión en redes sociales con generación de copys asistida por Inteligencia Artificial.
  - name: Horarios
    description: Horarios semanales del profesorado, reducciones lectivas y comparador de huecos libres para reuniones.
  - name: Guardias
    description: Asignación equitativa por rondas con contadores históricos y registro de coberturas reales.
  - name: Ausencias
    description: Tramitación de ausencias docentes (genéricas, administrativas, extraescolares), justificantes y firma PDF.
  - name: Aulas y Emplazamiento
    description: Catálogo de aulas y distribuciones espaciales de pupitres (layouts) por grupo y módulo.
  - name: Retrasos
    description: Registro de impuntualidades del alumnado para seguimiento tutorial e histórico acumulado.
  - name: Aula de Convivencia
    description: Derivaciones disciplinarias de jefatura, asignación de tareas académicas y visualización por guardia.
  - name: Tickets
    description: Sistema unificado de peticiones operativas para incidencias RMI, compras e inventario y redes sociales.
  - name: Documentos
    description: Repositorio documental privado segmentado por departamento didáctico y proyectos institucionales.
  - name: Espacios y Recursos
    description: Catálogo de dependencias comunes y recursos tecnológicos o audiovisuales prestables.
  - name: Reservas
    description: Sistema de reserva de espacios y recursos con validación estricta de solapamientos horarios.
  - name: Comisiones de Servicio
    description: Solicitud de desplazamientos oficiales, cálculo de gastos, generación de orden oficial y firma.
  - name: FEM (Formación en Empresas)
    description: Seguimiento de FCT y FP Dual, geolocalización con mapa interactivo y cómputo de horas sobre 500h.
  - name: Dashboard Directivo
    description: Cuadro de mando para el equipo directivo con los 9 KPIs obligatorios y configuración de umbrales.
  - name: Auditoría
    description: Registro inmutable de actividad y eventos críticos para seguridad y trazabilidad.
  - name: RGPD
    description: Consentimientos informados, ejercicio de derechos ARCO y trazabilidad de acceso a datos de menores.
  - name: Onboarding
    description: Guía de bienvenida para nuevos docentes con lista interactiva de tareas y vídeos formativos.
  - name: Google Calendar
    description: Sincronización bidireccional del horario docente y guardias con el calendario institucional de Google.

paths:
  # =========================================================================
  # 1. AUTENTICACIÓN (/api/v1/auth)
  # =========================================================================
  /api/v1/auth/login/google:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión con Google OAuth2
      description: |
        Autentica a un docente mediante un token o código de autorización emitido por Google Workspace.
        Si el usuario no existe previamente en el sistema, se crea automáticamente con estado `pendiente_confirmacion`
        a la espera de ser aprobado por la dirección/administración. Devuelve el par de tokens JWT (`access_token` y `refresh_token`).
      operationId: autenticarConGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginGoogleRequest'
      responses:
        '200':
          description: Autenticación exitosa. Se devuelven los tokens JWT y el perfil básico del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRespuesta'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          description: Usuario pendiente de confirmación o desactivado por administración.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/auth/refresh:
    post:
      tags:
        - Autenticación
      summary: Renovar token de acceso JWT
      description: |
        Genera un nuevo par de tokens JWT (`access_token` y `refresh_token`) utilizando un `refresh_token` válido y vigente.
        Implementa rotación automática de refresh token para prevenir ataques de repetición.
      operationId: renovarTokenAcceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token renovado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPar'
        '401':
          description: Refresh token inválido, revocado o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión e invalidar tokens
      description: Invalida el `refresh_token` en la lista negra de Redis, cerrando la sesión del dispositivo.
      operationId: cerrarSesion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Sesión cerrada correctamente. No se devuelve contenido.
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 2. USUARIOS (/api/v1/usuarios)
  # =========================================================================
  /api/v1/usuarios/me:
    get:
      tags:
        - Usuarios
      summary: Obtener perfil del usuario autenticado
      description: Devuelve el perfil completo, departamento y roles del usuario identificado por el token JWT.
      operationId: obtenerMiPerfil
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del docente autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Respuesta401'
    put:
      tags:
        - Usuarios
      summary: Actualizar datos personales del usuario autenticado
      description: Permite al docente actualizar su información de contacto (teléfono, fotografía, biografía corta).
      operationId: actualizarMiPerfil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioPerfilActualizar'
      responses:
        '200':
          description: Perfil actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios con filtros y paginación
      description: Obtiene la lista paginada de usuarios docentes del centro. Requiere rol `administrador` o `jefatura_estudios`.
      operationId: listarUsuarios
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          description: Filtrar por estado del usuario
          required: false
          schema:
            type: string
            enum: [activo, inactivo, pendiente_confirmacion]
            example: activo
        - name: rol
          in: query
          description: Filtrar por rol asignado
          required: false
          schema:
            type: string
            enum: [profesor, administrador, jefatura_estudios, secretaria, responsable_rmi, admin_rrss, direccion]
            example: profesor
        - name: departamento_id
          in: query
          description: Filtrar por identificador de departamento
          required: false
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
        - name: busqueda
          in: query
          description: Búsqueda por texto en nombre, apellidos o correo electrónico
          required: false
          schema:
            type: string
            example: Sanchez
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de usuarios obtenida satisfactoriamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarios'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - Usuarios
      summary: Crear usuario manualmente (Administrador)
      description: Registra un nuevo docente en la intranet sin necesidad de login previo con Google. Requiere rol `administrador`.
      operationId: crearUsuario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCrear'
      responses:
        '201':
          description: Usuario creado exitosamente. Se incluye cabecera Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '409':
          description: El correo electrónico ya está registrado en el sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/usuarios/{usuario_id}:
    get:
      tags:
        - Usuarios
      summary: Obtener detalle de un usuario
      description: Devuelve la ficha completa de un docente específico. Requiere rol `administrador` o `jefatura_estudios`.
      operationId: obtenerUsuarioPorId
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: path
          required: true
          description: Identificador único del usuario (MongoDB ObjectId)
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Ficha de usuario encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    put:
      tags:
        - Usuarios
      summary: Actualizar usuario completo (Administrador)
      description: Sustituye todos los datos administrativos del usuario. Requiere rol `administrador`.
      operationId: actualizarUsuarioCompleto
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: path
          required: true
          description: Identificador del usuario a modificar
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizar'
      responses:
        '200':
          description: Usuario actualizado satisfactoriamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    patch:
      tags:
        - Usuarios
      summary: Modificar parcialmente usuario o aprobar registro
      description: |
        Permite a la administración activar, desactivar o aprobar un usuario en estado `pendiente_confirmacion`.
        Transiciones de estado controladas. Requiere rol `administrador`.
      operationId: modificarEstadoUsuario
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: path
          required: true
          description: Identificador del usuario
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioEstadoPatch'
      responses:
        '200':
          description: Estado o propiedades del usuario modificadas correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '409':
          description: Transición de estado inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'
    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario del centro
      description: Elimina un usuario del sistema (baja definitiva o borrado de cuenta). Requiere rol `administrador`.
      operationId: eliminarUsuario
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: path
          required: true
          description: Identificador del usuario a eliminar
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '204':
          description: Usuario eliminado correctamente. Sin contenido.
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/usuarios/{usuario_id}/roles:
    put:
      tags:
        - Usuarios
      summary: Asignar o reemplazar roles de un usuario
      description: Establece el listado exhaustivo de roles asignados al usuario. Requiere rol `administrador`.
      operationId: asignarRolesUsuario
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: path
          required: true
          description: Identificador del usuario
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRolesPut'
      responses:
        '200':
          description: Roles actualizados exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 3. DEPARTAMENTOS (/api/v1/departamentos)
  # =========================================================================
  /api/v1/departamentos:
    get:
      tags:
        - Departamentos
      summary: Listar departamentos didácticos
      description: Obtiene la lista de todos los departamentos didácticos y de familias profesionales del instituto.
      operationId: listarDepartamentos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de departamentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartamentos'
        '401':
          $ref: '#/components/responses/Respuesta401'
    post:
      tags:
        - Departamentos
      summary: Crear departamento didáctico
      description: Da de alta un nuevo departamento en el centro. Requiere rol `administrador`.
      operationId: crearDepartamento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoCrear'
      responses:
        '201':
          description: Departamento creado exitosamente. Se incluye Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '409':
          description: Ya existe un departamento con ese código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/departamentos/{departamento_id}:
    get:
      tags:
        - Departamentos
      summary: Obtener detalle de departamento
      description: Retorna la información de un departamento, incluyendo jefatura de departamento y miembros.
      operationId: obtenerDepartamentoPorId
      security:
        - bearerAuth: []
      parameters:
        - name: departamento_id
          in: path
          required: true
          description: Identificador del departamento
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Detalle del departamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    put:
      tags:
        - Departamentos
      summary: Actualizar departamento didáctico
      description: Actualiza los datos de un departamento existente. Requiere rol `administrador`.
      operationId: actualizarDepartamento
      security:
        - bearerAuth: []
      parameters:
        - name: departamento_id
          in: path
          required: true
          description: Identificador del departamento
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartamentoCrear'
      responses:
        '200':
          description: Departamento actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Departamento'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 4. TABLÓN DE ANUNCIOS (/api/v1/anuncios)
  # =========================================================================
  /api/v1/anuncios:
    get:
      tags:
        - Tablón de Anuncios
      summary: Listar anuncios del tablón
      description: |
        Feed de anuncios segmentado por ámbito (general o departamental), departamento y estado destacado.
        Aplica borrado lógico para anuncios caducados a menos que se especifique `incluir_caducados=true` con permisos directivos.
      operationId: listarAnuncios
      security:
        - bearerAuth: []
      parameters:
        - name: departamento_id
          in: query
          required: false
          description: Filtrar por departamento didáctico
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
        - name: ambito
          in: query
          required: false
          description: Ámbito de difusión del anuncio
          schema:
            type: string
            enum: [general, departamental]
            example: general
        - name: destacado
          in: query
          required: false
          description: Filtrar únicamente avisos fijados como destacados
          schema:
            type: boolean
            example: true
        - name: incluir_caducados
          in: query
          required: false
          description: Incluir anuncios cuya fecha de caducidad ha sido superada
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PaginaParam'
