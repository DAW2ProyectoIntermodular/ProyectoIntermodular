    get:
      tags:
        - RGPD
      summary: Detalle de una solicitud RGPD
      description: Consulta los datos y motivos de una petición de ejercicio de derechos.
      operationId: obtenerSolicitudRGPD
      security:
        - bearerAuth: []
      parameters:
        - name: solicitud_id
          in: path
          required: true
          description: Identificador de la solicitud
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Ficha de la solicitud RGPD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudRGPD'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    patch:
      tags:
        - RGPD
      summary: Resolver formalmente solicitud RGPD (Admin / DPO)
      description: Cierra la solicitud emitiendo resolución razonada y comunicándola al interesado.
      operationId: resolverSolicitudRGPD
      security:
        - bearerAuth: []
      parameters:
        - name: solicitud_id
          in: path
          required: true
          description: Identificador de la solicitud
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
                  enum: [resuelta, desestimada]
                  example: resuelta
                resolucion:
                  type: string
                  example: Se ha procedido a la rectificación de los datos solicitados en el expediente docente.
              required:
                - estado
                - resolucion
      responses:
        '200':
          description: Solicitud resuelta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudRGPD'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

