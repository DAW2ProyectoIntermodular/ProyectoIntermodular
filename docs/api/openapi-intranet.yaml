# =============================================================================
# COMPONENTS (SECURITY, PARAMETERS, HEADERS, RESPONSES, SCHEMAS)
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acceso JWT (Access Token) firmado mediante HMAC-SHA256 con tiempo de vida corto (15 minutos).
        Debe enviarse en la cabecera HTTP: `Authorization: Bearer <access_token>`.
        Contiene los claims del usuario: `sub` (ID usuario), `email`, `roles` y `exp`.
    oauth2Google:
      type: oauth2
      description: Flujo de autorización federada mediante Google Workspace del centro docente.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            openid: Identificador único del usuario
            email: Dirección de correo institucional (@iesramonarcas.es)
            profile: Nombre, apellidos y fotografía de perfil
            https://www.googleapis.com/auth/calendar.events: Gestión de eventos en Google Calendar

  parameters:
    PaginaParam:
      name: page
      in: query
      description: Número de página para la paginación (1-indexed)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    LimiteParam:
      name: limit
      in: query
      description: Cantidad de elementos por página (máximo 50)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
        example: 10

  headers:
    LocationHeader:
      description: URI canónica del recurso recién creado
      schema:
        type: string
        format: uri
        example: /api/v1/usuarios/660e1d8f1b2c3d4e5f6a7b8c

  responses:
    Respuesta401:
      description: No autenticado. Token JWT ausente, expirado o con firma criptográfica inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetalle'
          example:
            detail: "Token de autenticación ausente o inválido."
    Respuesta403:
      description: Prohibido. El rol o permisos del usuario no le autorizan para ejecutar esta acción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetalle'
          example:
            detail: "No dispone de los permisos necesarios para realizar esta acción."
    Respuesta404:
      description: Recurso no encontrado. El identificador proporcionado no existe en la base de datos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetalle'
          example:
            detail: "El recurso solicitado no fue encontrado."
    Respuesta409:
      description: Conflicto de estado. Inconsistencia, solapamiento horario o transición de estado no permitida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetalle'
          example:
            detail: "Conflicto con el estado actual del recurso."
    Respuesta422:
      description: Entidad no procesable. Error de validación en los parámetros o cuerpo de la petición (Pydantic).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorValidacion'

  schemas:
    # -----------------------------------------------------------------------
    # FORMATOS DE ERROR Y COMUNES
    # -----------------------------------------------------------------------
    ErrorDetalle:
      type: object
      description: Formato canónico uniforme de mensaje de error en toda la API.
      properties:
        detail:
          type: string
          description: Descripción comprensible y detallada del motivo del fallo.
          example: "Credenciales de acceso incorrectas o usuario no encontrado."
      required:
        - detail

    ErrorValidacion:
      type: object
      description: Detalle de errores de validación de esquemas Pydantic / FastAPI.
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
                example: ["body", "email"]
              msg:
                type: string
                example: "value is not a valid email address"
              type:
                type: string
                example: "value_error.email"
      required:
        - detail

    TokenPar:
      type: object
      description: Par de tokens JWT para autenticación continua y segura.
      properties:
        access_token:
          type: string
          description: Token de corta duración para autorización en cabecera HTTP Bearer.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NjBlMWQ4ZiIsImV4cCI6MTcx..."
        refresh_token:
          type: string
          description: Token de larga duración para renovación automática del access token.
          example: "dGhpcy1pcy1hLXZhbGlkLXJlZnJlc2gtdG9rZW4tZXhhbXBsZQ..."
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          description: Tiempo de expiración del access token en segundos (15 minutos).
          example: 900
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in

    LoginGoogleRequest:
      type: object
      description: Carga útil para inicio de sesión federado con Google OAuth2.
      properties:
        credential:
          type: string
          description: Token de identidad JWT (ID Token) emitido por Google Identity Services.
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjFhMmIzYyJ9..."
      required:
        - credential

    RefreshTokenRequest:
      type: object
      description: Petición de renovación o revocación de token.
      properties:
        refresh_token:
          type: string
          description: Token de actualización emitido previamente.
          example: "dGhpcy1pcy1hLXZhbGlkLXJlZnJlc2gtdG9rZW4tZXhhbXBsZQ..."
      required:
        - refresh_token

    LoginRespuesta:
      type: object
      description: Respuesta tras login exitoso.
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPar'
        usuario:
          $ref: '#/components/schemas/Usuario'
      required:
        - tokens
        - usuario

    # -----------------------------------------------------------------------
    # MODELO: USUARIOS Y ROLES
    # -----------------------------------------------------------------------
    Usuario:
      type: object
      description: Ficha completa de usuario docente o administrativo.
      properties:
        id:
          type: string
          description: Identificador único en MongoDB (ObjectId hex string).
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        email:
          type: string
          format: email
          example: "antonio.sanchez@iesramonarcas.es"
        nombre:
          type: string
          example: "Antonio"
        apellidos:
          type: string
          example: "Sánchez Lorente"
        telefono:
          type: string
          nullable: true
          example: "+34 600 123 456"
        foto_url:
          type: string
          format: uri
          nullable: true
          example: "https://lh3.googleusercontent.com/a/ACg8oc..."
        biografia:
          type: string
          nullable: true
          example: "Docente de Informática y Comunicaciones, tutor de DAW2."
        departamento_id:
          type: string
          nullable: true
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        departamento_nombre:
          type: string
          nullable: true
          example: "Informática y Comunicaciones"
        roles:
          type: array
          items:
            type: string
            enum: [profesor, administrador, jefatura_estudios, secretaria, responsable_rmi, admin_rrss, direccion]
          example: ["profesor", "responsable_rmi"]
        estado:
          type: string
          enum: [activo, inactivo, pendiente_confirmacion]
          example: "activo"
        google_id:
          type: string
          nullable: true
          example: "109823471092837401928"
        fecha_creacion:
          type: string
          format: date-time
          example: "2026-09-01T08:00:00Z"
        ultimo_acceso:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-15T08:15:30Z"
      required:
        - id
        - email
        - nombre
        - apellidos
        - roles
        - estado
        - fecha_creacion

    UsuarioCrear:
      type: object
      description: Datos para crear un nuevo usuario docente de forma manual.
      properties:
        email:
          type: string
          format: email
          example: "maria.garcia@iesramonarcas.es"
        nombre:
          type: string
          example: "María"
        apellidos:
          type: string
          example: "García Martínez"
        telefono:
          type: string
          nullable: true
          example: "+34 611 223 344"
        departamento_id:
          type: string
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        roles:
          type: array
          items:
            type: string
            enum: [profesor, administrador, jefatura_estudios, secretaria, responsable_rmi, admin_rrss, direccion]
          default: ["profesor"]
          example: ["profesor"]
        estado:
          type: string
          enum: [activo, inactivo, pendiente_confirmacion]
          default: "activo"
          example: "activo"
      required:
        - email
        - nombre
        - apellidos
        - departamento_id

    UsuarioActualizar:
      type: object
      description: Datos para sustitución completa de un usuario.
      properties:
        email:
          type: string
          format: email
          example: "maria.garcia@iesramonarcas.es"
        nombre:
          type: string
          example: "María"
        apellidos:
          type: string
          example: "García Martínez"
        telefono:
          type: string
          nullable: true
          example: "+34 611 223 344"
        departamento_id:
          type: string
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        roles:
          type: array
          items:
            type: string
            enum: [profesor, administrador, jefatura_estudios, secretaria, responsable_rmi, admin_rrss, direccion]
          example: ["profesor"]
        estado:
          type: string
          enum: [activo, inactivo, pendiente_confirmacion]
          example: "activo"
      required:
        - email
        - nombre
        - apellidos
        - departamento_id
        - roles
        - estado

    UsuarioPerfilActualizar:
      type: object
      description: Datos personales que el propio docente puede actualizar.
      properties:
        telefono:
          type: string
          nullable: true
          example: "+34 600 999 888"
        foto_url:
          type: string
          format: uri
          nullable: true
          example: "https://intranet.iesramonarcas.es/media/perfiles/antonio.jpg"
        biografia:
          type: string
          nullable: true
          example: "Profesor técnico de FP, especialidad informática."

    UsuarioEstadoPatch:
      type: object
      description: Modificación de estado de cuenta.
      properties:
        estado:
          type: string
          enum: [activo, inactivo, pendiente_confirmacion]
          example: "activo"
        motivo:
          type: string
          nullable: true
          example: "Docente reincorporado de excedencia."
      required:
        - estado

    UsuarioRolesPut:
      type: object
      description: Asignación de roles de sistema.
      properties:
        roles:
          type: array
          items:
            type: string
            enum: [profesor, administrador, jefatura_estudios, secretaria, responsable_rmi, admin_rrss, direccion]
          example: ["profesor", "jefatura_estudios"]
      required:
        - roles

    PaginatedUsuarios:
      type: object
      description: Contenedor estándar paginado para la colección de usuarios.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 84
      required:
        - items
        - page
        - limit
        - total

    # -----------------------------------------------------------------------
    # MODELO: DEPARTAMENTOS
    # -----------------------------------------------------------------------
    Departamento:
      type: object
      description: Departamento didáctico o de coordinación pedagógica.
      properties:
        id:
          type: string
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        codigo:
          type: string
          example: "DEP-INF"
        nombre:
          type: string
          example: "Informática y Comunicaciones"
        descripcion:
          type: string
          example: "Departamento didáctico responsable de los ciclos de FP Básica, SMR, DAM y DAW."
        jefe_departamento_id:
          type: string
          nullable: true
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        jefe_departamento_nombre:
          type: string
          nullable: true
          example: "Antonio Sánchez Lorente"
        miembros_count:
          type: integer
          example: 14
      required:
        - id
        - codigo
        - nombre

    DepartamentoCrear:
      type: object
      description: Creación de departamento.
      properties:
        codigo:
          type: string
          example: "DEP-INF"
        nombre:
          type: string
          example: "Informática y Comunicaciones"
        descripcion:
          type: string
          example: "Familia Profesional de Informática"
        jefe_departamento_id:
          type: string
          nullable: true
          example: "660e1d8f1b2c3d4e5f6a7b8c"
      required:
        - codigo
        - nombre

    PaginatedDepartamentos:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Departamento'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 18
      required:
        - items
        - page
        - limit
        - total

    # -----------------------------------------------------------------------
    # MODELO: TABLÓN DE ANUNCIOS
    # -----------------------------------------------------------------------
    Anuncio:
      type: object
      description: Anuncio o comunicado docente interno.
      properties:
        id:
          type: string
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        titulo:
          type: string
          example: "Convocatoria Claustro Extraordinario de Evaluación"
        cuerpo:
          type: string
          example: "Se convoca a todo el profesorado el próximo martes a las 16:00 horas en el Salón de Actos."
        autor_id:
          type: string
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        autor_nombre:
          type: string
          example: "Dirección IES Ramón Arcas Meca"
        departamento_id:
          type: string
          nullable: true
          example: null
        departamento_nombre:
          type: string
          nullable: true
          example: null
        ambito:
          type: string
          enum: [general, departamental]
          example: "general"
        destacado:
          type: boolean
          example: true
        fecha_publicacion:
          type: string
          format: date-time
          example: "2026-10-14T09:00:00Z"
        fecha_caducidad:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-21T23:59:59Z"
        activo:
          type: boolean
          description: Indica si el anuncio está vigente (borrado lógico de caducados).
          example: true
      required:
        - id
        - titulo
        - cuerpo
        - autor_id
        - autor_nombre
        - ambito
        - destacado
        - fecha_publicacion
        - activo

    AnuncioCrear:
      type: object
      properties:
        titulo:
          type: string
          example: "Reunión de coordinación Erasmus+ FP"
        cuerpo:
          type: string
          example: "Presentación de movilidades KA121 para alumnado de DAW2 y SMR2."
        departamento_id:
          type: string
          nullable: true
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        ambito:
          type: string
          enum: [general, departamental]
          default: "general"
          example: "general"
        destacado:
          type: boolean
          default: false
          example: true
        fecha_caducidad:
          type: string
          format: date-time
          nullable: true
          example: "2026-10-31T23:59:59Z"
      required:
        - titulo
        - cuerpo
        - ambito

    AnuncioPatch:
      type: object
      properties:
        destacado:
          type: boolean
          example: false
        fecha_caducidad:
          type: string
          format: date-time
          nullable: true
          example: "2026-11-15T23:59:59Z"
        activo:
          type: boolean
          example: false

    PaginatedAnuncios:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Anuncio'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 35
      required:
        - items
        - page
        - limit
        - total

    # -----------------------------------------------------------------------
    # MODELO: NOTIFICACIONES
    # -----------------------------------------------------------------------
    Notificacion:
      type: object
      properties:
        id:
          type: string
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        usuario_id:
          type: string
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        titulo:
          type: string
          example: "Guardia asignada en 3ª hora"
        mensaje:
          type: string
          example: "Has sido asignado para cubrir la guardia de DWES en el aula 104 por el algoritmo de rondas."
        tipo:
          type: string
          enum: [anuncio, guardia, horario, ticket, ausencia, sistema]
          example: "guardia"
        leida:
          type: boolean
          example: false
        url_destino:
          type: string
          nullable: true
          example: "/guardias/660e1d8f1b2c3d4e5f6a7b8c"
        fecha_creacion:
          type: string
          format: date-time
          example: "2026-10-15T09:45:00Z"
      required:
        - id
        - usuario_id
        - titulo
        - mensaje
        - tipo
        - leida
        - fecha_creacion

    NotificacionEstadoPatch:
      type: object
      properties:
        leida:
          type: boolean
          example: true
      required:
        - leida

    SuscripcionPushRequest:
      type: object
      description: Objeto de suscripción del navegador para Web Push API.
      properties:
        endpoint:
          type: string
          format: uri
          example: "https://fcm.googleapis.com/fcm/send/dKx9..."
        keys:
          type: object
          properties:
            p256dh:
              type: string
              example: "BNcRdreALRF8..."
            auth:
              type: string
              example: "tBHItJI..."
          required:
            - p256dh
            - auth
      required:
        - endpoint
        - keys

    SuscripcionPush:
      type: object
      properties:
