  # =========================================================================
  # 15. ESPACIOS Y RECURSOS PRESTABLES (/api/v1/espacios, /api/v1/recursos)
  # =========================================================================
  /api/v1/espacios:
    get:
      tags:
        - Espacios y Recursos
      summary: Listar dependencias y espacios comunes reservables
      description: Obtiene el catálogo de espacios reservables (salón de actos, biblioteca, salas polivalentes, aulas TIC).
      operationId: listarEspacios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catálogo de espacios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Espacio'
        '401':
          $ref: '#/components/responses/Respuesta401'
    post:
      tags:
        - Espacios y Recursos
      summary: Crear nuevo espacio reservable
      description: Da de alta un nuevo espacio en el centro. Requiere rol `administrador`.
      operationId: crearEspacio
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspacioCrear'
      responses:
        '201':
          description: Espacio creado. Se incluye Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Espacio'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '409':
          description: Ya existe un espacio con ese código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/recursos:
    get:
      tags:
        - Espacios y Recursos
      summary: Listar recursos y equipamiento tecnológico prestable
      description: Obtiene la relación de recursos móviles (carros de portátiles, proyectores portátiles, cámaras, megafonía).
      operationId: listarRecursos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catálogo de recursos prestables.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recurso'
        '401':
          $ref: '#/components/responses/Respuesta401'
    post:
      tags:
        - Espacios y Recursos
      summary: Crear nuevo recurso tecnológico prestable
      description: Da de alta un nuevo equipo o recurso para reserva. Requiere rol `administrador`.
      operationId: crearRecurso
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecursoCrear'
      responses:
        '201':
          description: Recurso creado. Se incluye Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurso'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '409':
          description: Ya existe un recurso con ese número de serie o código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 16. RESERVAS (/api/v1/reservas)
  # =========================================================================
  /api/v1/reservas:
    get:
      tags:
        - Reservas
      summary: Listar reservas de espacios y recursos
      description: Consulta las reservas concertadas para una fecha, espacio o recurso concreto.
      operationId: listarReservas
      security:
        - bearerAuth: []
      parameters:
        - name: espacio_id
          in: query
          required: false
          description: Filtrar por espacio reservado
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
        - name: recurso_id
          in: query
          required: false
          description: Filtrar por recurso reservado
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8d
        - name: fecha
          in: query
          required: false
          description: Filtrar por fecha de la reserva (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-16"
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de reservas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservas'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - Reservas
      summary: Crear reserva de espacio o recurso
      description: |
        Realiza la reserva de un espacio o recurso para un tramo horario determinado.
        Comprueba de forma atómica en Redis/MongoDB que no exista ningún solapamiento horario;
        en caso de colisión horaria devuelve inmediatamente `409 Conflict`.
      operationId: crearReserva
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaCrear'
      responses:
        '201':
          description: Reserva formalizada exitosamente. Se incluye Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '409':
          description: Conflicto de horario. El recurso o espacio ya está reservado en ese intervalo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/reservas/{reserva_id}:
    get:
      tags:
        - Reservas
      summary: Obtener detalle de una reserva
      description: Recupera la información completa de la reserva.
      operationId: obtenerReservaPorId
      security:
        - bearerAuth: []
      parameters:
        - name: reserva_id
          in: path
          required: true
          description: Identificador de la reserva
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Ficha de reserva obtenida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    put:
      tags:
        - Reservas
      summary: Actualizar datos de reserva
      description: Modifica horario o motivo de una reserva, con revalidación de solapamiento (`409 Conflict`).
      operationId: actualizarReserva
      security:
        - bearerAuth: []
      parameters:
        - name: reserva_id
          in: path
          required: true
          description: Identificador de la reserva
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaCrear'
      responses:
        '200':
          description: Reserva modificada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '409':
          description: El nuevo intervalo colisiona con otra reserva existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'
    delete:
      tags:
        - Reservas
      summary: Cancelar reserva
      description: Libera el espacio o recurso cancelando la reserva activa.
      operationId: cancelarReserva
      security:
        - bearerAuth: []
      parameters:
        - name: reserva_id
          in: path
          required: true
          description: Identificador de la reserva
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '204':
          description: Reserva cancelada y recurso liberado.
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 17. COMISIONES DE SERVICIO (/api/v1/comisiones)
  # =========================================================================
  /api/v1/comisiones:
    get:
      tags:
        - Comisiones de Servicio
      summary: Listar solicitudes de comisión de servicio
      description: Consulta las solicitudes de desplazamiento oficial tramitadas por el profesorado.
      operationId: listarComisiones
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtrar por estado de tramitación
          schema:
            type: string
            enum: [solicitada, aprobada, rechazada, liquidada]
            example: solicitada
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de comisiones de servicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComisiones'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - Comisiones de Servicio
      summary: Crear solicitud de comisión de servicio
      description: |
        Registra la petición de asistencia a cursos de formación de la Consejería, reuniones de coordinación o tribunales.
        Genera automáticamente el documento PDF oficial y activa el circuito de firma.
      operationId: crearComision
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComisionCrear'
      responses:
        '201':
          description: Comisión creada satisfactoriamente. Se incluye Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comision'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/comisiones/me:
    get:
      tags:
        - Comisiones de Servicio
      summary: Consultar mis comisiones de servicio
      description: Obtiene las comisiones de servicio solicitadas por el docente autenticado.
      operationId: listarMisComisiones
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista de comisiones del profesor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComisiones'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/comisiones/{comision_id}:
    get:
      tags:
        - Comisiones de Servicio
      summary: Obtener detalle de una comisión de servicio
      description: Retorna la información completa de kilometraje, justificación, itinerario y gastos previstos.
      operationId: obtenerComisionPorId
      security:
        - bearerAuth: []
      parameters:
        - name: comision_id
          in: path
          required: true
          description: Identificador de la comisión
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Ficha de comisión encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comision'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    patch:
      tags:
        - Comisiones de Servicio
      summary: Cambiar estado de comisión de servicio
