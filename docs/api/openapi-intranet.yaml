  # =========================================================================
  # 5. NOTIFICACIONES (/api/v1/notificaciones)
  # =========================================================================
  /api/v1/notificaciones:
    get:
      tags:
        - Notificaciones
      summary: Listar notificaciones del usuario autenticado
      description: Obtiene la lista paginada de notificaciones recibidas por el docente autenticado, con filtro por leídas/no leídas.
      operationId: listarNotificacionesUsuario
      security:
        - bearerAuth: []
      parameters:
        - name: leida
          in: query
          required: false
          description: Filtrar por estado de lectura (true=leídas, false=pendientes)
          schema:
            type: boolean
            example: false
        - name: tipo
          in: query
          required: false
          description: Filtrar por tipo de notificación
          schema:
            type: string
            enum: [anuncio, guardia, horario, ticket, ausencia, sistema]
            example: guardia
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista de notificaciones del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificaciones'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/notificaciones/{notificacion_id}:
    patch:
      tags:
        - Notificaciones
      summary: Marcar notificación como leída o no leída
      description: Actualiza el estado de lectura de una notificación concreta perteneciente al usuario autenticado.
      operationId: marcarNotificacionLeida
      security:
        - bearerAuth: []
      parameters:
        - name: notificacion_id
          in: path
          required: true
          description: Identificador de la notificación
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificacionEstadoPatch'
      responses:
        '200':
          description: Notificación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/notificaciones/leer-todas:
    patch:
      tags:
        - Notificaciones
      summary: Marcar todas las notificaciones como leídas
      description: Actualiza en lote todas las notificaciones pendientes de lectura del usuario a estado leídas.
      operationId: marcarTodasNotificacionesLeidas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notificaciones marcadas como leídas con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  modificadas:
                    type: integer
                    example: 5
                  mensaje:
                    type: string
                    example: Todas las notificaciones han sido marcadas como leídas.
        '401':
          $ref: '#/components/responses/Respuesta401'

  /api/v1/notificaciones/suscripcion-push:
    post:
      tags:
        - Notificaciones
      summary: Registrar suscripción a notificaciones Web Push
      description: |
        Almacena el endpoint y claves criptográficas (`p256dh`, `auth`) del navegador o PWA del usuario
        para el envío de avisos en tiempo real mediante el estándar Web Push y `pywebpush`.
      operationId: registrarSuscripcionPush
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuscripcionPushRequest'
      responses:
        '201':
          description: Suscripción push registrada exitosamente.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuscripcionPush'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'
    delete:
      tags:
        - Notificaciones
      summary: Eliminar suscripción a notificaciones Web Push
      description: Da de baja el dispositivo del usuario en el servicio de notificaciones push.
      operationId: eliminarSuscripcionPush
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                  format: uri
                  example: https://fcm.googleapis.com/fcm/send/dKx...
              required:
                - endpoint
      responses:
        '204':
          description: Suscripción push eliminada correctamente.
        '401':
          $ref: '#/components/responses/Respuesta401'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 6. PUBLICACIONES RRSS (/api/v1/publicaciones-rrss)
  # =========================================================================
  /api/v1/publicaciones-rrss/generar-texto:
    post:
      tags:
        - Publicaciones RRSS
      summary: Generar borrador de publicación para redes con IA
      description: |
        Envía los detalles de una actividad o evento escolar (título, descripción, departamento y tono deseado)
        a un modelo de lenguaje de Inteligencia Artificial para generar propuestas de texto (copys) y hashtags adecuados.
      operationId: generarTextoRrssConIA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicacionRrssGenerarIA'
      responses:
        '200':
          description: Propuesta de texto generada por la IA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionRrssIARespuesta'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/publicaciones-rrss:
    get:
      tags:
        - Publicaciones RRSS
      summary: Listar solicitudes de publicación en redes sociales
      description: Recupera la lista paginada de propuestas de publicación enviadas al equipo de redes sociales.
      operationId: listarPublicacionesRrss
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtrar por estado de la solicitud
          schema:
            type: string
            enum: [pendiente, en_curso, finalizado]
            example: pendiente
        - name: departamento_id
          in: query
          required: false
          description: Filtrar por departamento solicitante
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de publicaciones RRSS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicacionesRrss'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - Publicaciones RRSS
      summary: Crear solicitud de publicación en redes
      description: |
        Registra una solicitud formal de difusión en redes vinculada al sistema unificado de tickets.
        El administrador de redes sociales revisará el texto y descargará los recursos multimedia para su publicación.
      operationId: crearPublicacionRrss
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicacionRrssCrear'
      responses:
        '201':
          description: Solicitud de publicación registrada con éxito. Se incluye Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionRrss'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/publicaciones-rrss/{publicacion_id}:
    get:
      tags:
        - Publicaciones RRSS
      summary: Obtener detalle de una solicitud de publicación
      description: Retorna la ficha completa de la solicitud de difusión, incluyendo imágenes adjuntas y estado de tramitación.
      operationId: obtenerPublicacionRrssPorId
      security:
        - bearerAuth: []
      parameters:
        - name: publicacion_id
          in: path
          required: true
          description: Identificador de la publicación RRSS
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Ficha de la publicación encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionRrss'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    patch:
      tags:
        - Publicaciones RRSS
      summary: Actualizar estado de publicación en redes (Admin RRSS)
      description: |
        Permite al administrador de redes sociales cambiar el estado (`pendiente` -> `en_curso` -> `finalizado`),
        añadir enlaces a los posts publicados o indicar observaciones. Requiere rol `admin_rrss` o `administrador`.
      operationId: cambiarEstadoPublicacionRrss
      security:
        - bearerAuth: []
      parameters:
        - name: publicacion_id
          in: path
          required: true
          description: Identificador de la publicación RRSS
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicacionRrssEstadoPatch'
      responses:
        '200':
          description: Estado actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicacionRrss'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '409':
          description: Transición de estado no permitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 7. HORARIOS (/api/v1/horarios)
  # =========================================================================
  /api/v1/horarios/me:
    get:
      tags:
        - Horarios
      summary: Obtener horario semanal del docente autenticado
      description: |
        Devuelve la rejilla horaria semanal del profesor autenticado, desglosada por tramos lectivos
        (módulo, grupo, aula) y reducciones horarias (jefatura de departamento, tutoría, guardias, no disponibilidad).
      operationId: obtenerMiHorarioSemanal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Horario semanal completo del docente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorarioSemanal'
        '401':
          $ref: '#/components/responses/Respuesta401'

  /api/v1/horarios/{usuario_id}:
    get:
      tags:
        - Horarios
      summary: Obtener horario de un docente específico
      description: Consulta el horario semanal de un profesor concreto. Requiere rol `administrador` o `jefatura_estudios`.
      operationId: obtenerHorarioDocentePorId
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: path
          required: true
          description: Identificador del usuario docente
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Horario semanal del docente indicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorarioSemanal'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    put:
      tags:
        - Horarios
      summary: Reemplazar horario completo de un docente
      description: Sustituye íntegramente la asignación horaria semanal de un docente. Requiere rol `administrador` o `jefatura_estudios`.
      operationId: reemplazarHorarioDocente
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: path
          required: true
          description: Identificador del docente
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioSemanalReemplazar'
      responses:
        '200':
          description: Horario sustituido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorarioSemanal'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/horarios:
    post:
      tags:
        - Horarios
      summary: Crear o añadir tramo al horario docente
      description: Registra una nueva asignación de tramo lectivo o reducción horaria para un docente. Requiere rol `administrador`.
      operationId: crearTramoHorario
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TramoHorarioCrear'
      responses:
        '201':
          description: Tramo horario registrado correctamente.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TramoHorario'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '409':
          description: Solapamiento horario con otro tramo del mismo docente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/horarios/comparar:
    post:
      tags:
        - Horarios
      summary: Comparar huecos libres entre 2 o más docentes
      description: |
        Calcula la intersección matemática de períodos no lectivos ni ocupados de 2 o más profesores
        para proponer reuniones de departamento, coordinación pedagógica o tutorías compartidas.
      operationId: compararHorariosDocentes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioCompararRequest'
      responses:
        '200':
          description: Lista de tramos y días donde todos los docentes especificados coinciden libres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorarioCompararRespuesta'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 8. GUARDIAS (/api/v1/guardias)
  # =========================================================================
  /api/v1/guardias/asignar:
    post:
      tags:
        - Guardias
      summary: Ejecutar algoritmo de asignación de guardias por rondas
      description: |
        Aplica el algoritmo oficial de rondas de guardia del centro:
        1. Identifica los docentes que tienen hora de guardia asignada en el hueco horario afectado.
        2. Consulta el contador histórico de guardias efectivamente realizadas por cada docente disponible en ESE HUECO concreto.
        3. En caso de empate en el contador, efectúa una selección pseudoaleatoria balanceada.
        4. Registra al profesor seleccionado como `docente_asignado`.
        5. Si el docente asignado no puede cubrir la guardia, se asigna a otro disponible y se compensa en rondas posteriores.
      operationId: ejecutarAsignacionGuardia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardiaAsignarRequest'
      responses:
        '201':
          description: Guardia asignada por el algoritmo de rondas.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guardia'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '409':
          description: No hay profesores de guardia disponibles en ese tramo horario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/guardias:
    get:
      tags:
        - Guardias
      summary: Listar guardias del centro con filtros
      description: Consulta las guardias generadas para una fecha, tramo horario o estado.
      operationId: listarGuardias
      security:
        - bearerAuth: []
      parameters:
        - name: fecha
          in: query
          required: false
          description: Fecha de la guardia (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-15"
        - name: hueco_horario
          in: query
          required: false
          description: Número del período lectivo (1 a 7)
          schema:
            type: integer
            minimum: 1
            maximum: 7
            example: 3
        - name: estado
          in: query
          required: false
          description: Estado de cobertura de la guardia
          schema:
            type: string
            enum: [pendiente, cubierta, no_cubierta]
            example: pendiente
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de guardias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGuardias'
        '401':
          $ref: '#/components/responses/Respuesta401'
