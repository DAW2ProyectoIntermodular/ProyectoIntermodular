      summary: Firmar digitalmente el PDF de ausencia
      description: |
        Aplica la firma manuscrita digitalizada (trazado capturado en pantalla táctil/canvas) o firma electrónica
        mediante certificado digital al PDF oficial de la ausencia.
      operationId: firmarPdfAusencia
      security:
        - bearerAuth: []
      parameters:
        - name: ausencia_id
          in: path
