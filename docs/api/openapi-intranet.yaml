      operationId: listarDerivacionesConvivencia
      security:
        - bearerAuth: []
      parameters:
        - name: fecha
          in: query
          required: false
          description: Filtrar por fecha de la derivación (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-15"
        - name: hueco_horario
          in: query
          required: false
          description: Filtrar por tramo horario específico
          schema:
            type: integer
            example: 4
        - name: estado
          in: query
          required: false
          description: Estado de la derivación
