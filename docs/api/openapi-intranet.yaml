          schema:
            type: integer
            example: 1
        - name: tipo
          in: query
          required: false
          description: Tipología de aula
          schema:
            type: string
            enum: [ordinaria, tic, laboratorio, taller]
            example: tic
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de aulas.
