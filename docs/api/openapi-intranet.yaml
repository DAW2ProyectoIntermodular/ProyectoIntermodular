        fecha:
          type: string
          format: date
          example: "2026-10-15"
        hueco_horario:
          type: integer
          minimum: 1
          maximum: 7
          example: 3
        ausencia_id:
          type: string
          nullable: true
          example: "660e1d8f1b2c3d4e5f6a7b8e"
        aula_o_destino:
          type: string
          example: "Aula 102 (SMR1)"
        tipo_guardia:
          type: string
          enum: [aula, convivencia, biblioteca, recreo]
          default: "aula"
          example: "aula"
      required:
        - fecha
        - hueco_horario
        - aula_o_destino

