    post:
      tags:
        - RGPD
      summary: Registrar nueva solicitud de ejercicio de derechos ARCO
      description: Tramita una solicitud oficial de ejercicio de derechos ante el Delegado de Protección de Datos.
      operationId: crearSolicitudRGPD
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
