  # =========================================================================
  # 13. TICKETS (/api/v1/tickets)
  # =========================================================================
  /api/v1/tickets:
    get:
      tags:
        - Tickets
      summary: Listar tickets de solicitud operativa
      description: |
        Consulta la cola de peticiones y solicitudes operativas. Filtra por tipo de flujo
        (`rmi`: incidencias informáticas; `compras`: presupuestos/adquisiciones; `rrss`: publicaciones).
      operationId: listarTickets
      security:
        - bearerAuth: []
      parameters:
        - name: tipo
          in: query
          required: false
          description: Flujo de trabajo del ticket
          schema:
            type: string
            enum: [rmi, compras, rrss]
            example: rmi
        - name: estado
          in: query
          required: false
          description: Estado en la cola
          schema:
            type: string
            enum: [pendiente, en_curso, finalizado]
            example: pendiente
        - name: solicitante_id
          in: query
          required: false
          description: Filtrar por profesor solicitante
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de tickets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - Tickets
      summary: Crear ticket operativo unificado
      description: |
        Crea una nueva solicitud según su tipo:
        - `rmi`: Requiere aula, dispositivo y descripción técnica (notifica por email al responsable RMI).
        - `compras`: Requiere artículos, desglose presupuestario y justificación (notifica al secretario).
        - `rrss`: Difusión en redes sociales (notifica al gestor de RRSS).
      operationId: crearTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCrear'
      responses:
        '201':
          description: Ticket creado satisfactoriamente. Se incluye Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/tickets/me:
    get:
      tags:
        - Tickets
      summary: Consultar mis tickets emitidos
      description: Devuelve el histórico de solicitudes tramitadas por el usuario autenticado.
      operationId: listarMisTickets
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista de tickets del docente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/tickets/{ticket_id}:
    get:
      tags:
        - Tickets
      summary: Obtener detalle completo de un ticket
      description: Recupera los datos genéricos y específicos (`datos_especificos`), historial y adjuntos del ticket.
      operationId: obtenerTicketPorId
      security:
        - bearerAuth: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: Identificador del ticket
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Detalle del ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    put:
      tags:
        - Tickets
      summary: Actualizar ticket completo
      description: Modifica íntegramente la información de la solicitud.
      operationId: actualizarTicketCompleto
      security:
        - bearerAuth: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: Identificador del ticket
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCrear'
      responses:
        '200':
          description: Ticket actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    patch:
      tags:
        - Tickets
      summary: Cambiar estado o asignar responsable del ticket
      description: Permite transicionar el estado del ticket (`pendiente` -> `en_curso` -> `finalizado`) o reasignarlo.
      operationId: transicionarEstadoTicket
      security:
        - bearerAuth: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: Identificador del ticket
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketEstadoPatch'
      responses:
        '200':
          description: Estado del ticket actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '409':
          description: Transición de estado no válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'
    delete:
      tags:
        - Tickets
      summary: Eliminar ticket
      description: Elimina una solicitud del sistema. Solo solicitante en estado pendiente o administrador.
      operationId: eliminarTicket
      security:
        - bearerAuth: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: Identificador del ticket
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '204':
          description: Ticket eliminado correctamente.
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/tickets/{ticket_id}/adjuntos:
    get:
      tags:
        - Tickets
      summary: Listar adjuntos de un ticket
      description: Consulta los archivos adjuntos (presupuestos, facturas, fotos de avería) vinculados al ticket.
      operationId: listarAdjuntosTicket
      security:
        - bearerAuth: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: Identificador del ticket
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Lista de archivos adjuntos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketAdjunto'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - Tickets
      summary: Subir archivo adjunto a un ticket
      description: Carga un fichero adjunto asociado a la solicitud (imagen de daño, presupuesto en PDF).
      operationId: subirAdjuntoTicket
      security:
        - bearerAuth: []
      parameters:
        - name: ticket_id
          in: path
          required: true
          description: Identificador del ticket
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Fichero adjunto a subir
              required:
                - archivo
      responses:
        '201':
          description: Adjunto subido satisfactoriamente.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAdjunto'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
  # 14. DOCUMENTOS (/api/v1/documentos)
  # =========================================================================
  /api/v1/documentos:
    get:
      tags:
        - Documentos
      summary: Listar documentos del repositorio documental
      description: |
        Consulta los documentos institucionales privados. El sistema filtra por permisos:
        cada profesor solo visualiza los documentos de su propio departamento didáctico o de proyectos en los que participa.
      operationId: listarDocumentos
      security:
        - bearerAuth: []
      parameters:
        - name: departamento_id
          in: query
          required: false
          description: Filtrar por departamento didáctico
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
        - name: proyecto_id
          in: query
          required: false
          description: Filtrar por proyecto institucional (p.ej. Erasmus+, Digitalización)
          schema:
            type: string
            example: PROY-ERASMUS-2026
        - name: categoria
          in: query
          required: false
          description: Categoría del documento
          schema:
            type: string
            enum: [programacion, acta, normativa, proyecto, otro]
            example: programacion
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de documentos disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentos'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - Documentos
      summary: Subir nuevo documento al repositorio
      description: Almacena un archivo con sus metadatos (departamento, categoría, descripción).
      operationId: subirDocumento
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Archivo a subir
                titulo:
                  type: string
                  example: Programación Didáctica DWES 2026-2027
                descripcion:
                  type: string
                  example: Programación docente actualizada adaptada a la nueva Ley de FP.
                categoria:
                  type: string
                  enum: [programacion, acta, normativa, proyecto, otro]
                  example: programacion
                departamento_id:
                  type: string
                  example: 660e1d8f1b2c3d4e5f6a7b8c
                proyecto_id:
                  type: string
                  nullable: true
                  example: null
              required:
                - archivo
                - titulo
                - categoria
                - departamento_id
      responses:
        '201':
          description: Documento almacenado exitosamente. Se incluye Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documento'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/documentos/{documento_id}:
