  # =========================================================================
  # 11. RETRASOS (/api/v1/retrasos)
  # =========================================================================
  /api/v1/retrasos:
    get:
      tags:
        - Retrasos
      summary: Listar retrasos del alumnado con filtros
      description: |
        Consulta el registro histórico de impuntualidades de los estudiantes.
        Los docentes solo tienen acceso a los retrasos registrados en sus módulos o tutorías;
        los datos globales agregados están restringidos al Dashboard directivo.
      operationId: listarRetrasos
      security:
        - bearerAuth: []
      parameters:
        - name: alumno_id
          in: query
          required: false
          description: Filtrar por identificador de alumno
          schema:
            type: string
            example: ALUM-2026-042
        - name: modulo
          in: query
          required: false
          description: Filtrar por código del módulo formativo
          schema:
            type: string
            example: DAW_DWES
        - name: fecha_desde
          in: query
          required: false
          description: Fecha de inicio de búsqueda (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-01"
        - name: fecha_hasta
          in: query
          required: false
          description: Fecha final de búsqueda (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-31"
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de retrasos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRetrasos'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - Retrasos
      summary: Registrar retraso de un alumno
      description: Registra la impuntualidad de un estudiante en un tramo lectivo y módulo concreto.
      operationId: registrarRetraso
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrasoCrear'
      responses:
        '201':
          description: Retraso anotado correctamente. Se incluye Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retraso'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/retrasos/{retraso_id}:
    get:
      tags:
        - Retrasos
      summary: Obtener detalle de un retraso
      description: Consulta los datos específicos de una incidencia de impuntualidad.
      operationId: obtenerRetrasoPorId
      security:
        - bearerAuth: []
      parameters:
        - name: retraso_id
          in: path
          required: true
          description: Identificador del retraso
