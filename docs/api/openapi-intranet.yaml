    # -----------------------------------------------------------------------
    # MODELO: HORARIOS
    # -----------------------------------------------------------------------
    TramoHorario:
      type: object
      description: Período lectivo o actividad no lectiva individual en la semana.
      properties:
        id:
          type: string
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        usuario_id:
          type: string
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        dia_semana:
          type: integer
          description: Día de la semana (1=Lunes, 2=Martes, 3=Miércoles, 4=Jueves, 5=Viernes)
          minimum: 1
          maximum: 5
          example: 1
        hueco_horario:
          type: integer
          description: Período del día (1 a 7)
          minimum: 1
          maximum: 7
          example: 3
        hora_inicio:
          type: string
          pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "10:15"
        hora_fin:
          type: string
          pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "11:10"
        tipo_tramo:
          type: string
          enum: [lectivo, guardia, tutoria, reduccion, reunion_departamento, libre]
          example: "lectivo"
        materia_o_actividad:
          type: string
          example: "Desarrollo Web en Entorno Servidor (DWES)"
        grupo:
          type: string
          nullable: true
          example: "DAW2"
        aula_id:
          type: string
          nullable: true
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        aula_nombre:
          type: string
          nullable: true
          example: "Aula TIC 2"
      required:
        - id
        - usuario_id
        - dia_semana
        - hueco_horario
        - hora_inicio
        - hora_fin
        - tipo_tramo
        - materia_o_actividad

    TramoHorarioCrear:
      type: object
      properties:
        usuario_id:
          type: string
          example: "660e1d8f1b2c3d4e5f6a7b8c"
        dia_semana:
          type: integer
          minimum: 1
          maximum: 5
          example: 1
        hueco_horario:
          type: integer
          minimum: 1
          maximum: 7
          example: 3
        hora_inicio:
          type: string
          example: "10:15"
        hora_fin:
          type: string
          example: "11:10"
        tipo_tramo:
          type: string
          enum: [lectivo, guardia, tutoria, reduccion, reunion_departamento, libre]
          example: "lectivo"
        materia_o_actividad:
          type: string
          example: "Desarrollo Web en Entorno Servidor"
        grupo:
          type: string
          nullable: true
          example: "DAW2"
        aula_id:
          type: string
          nullable: true
          example: "660e1d8f1b2c3d4e5f6a7b8c"
      required:
        - usuario_id
        - dia_semana
        - hueco_horario
        - hora_inicio
        - hora_fin
        - tipo_tramo
        - materia_o_actividad

    ReduccionHoraria:
      type: object
