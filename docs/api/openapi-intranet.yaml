      responses:
        '204':
          description: Ausencia cancelada con éxito.
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '409':
          description: No se puede cancelar una ausencia ya ejecutada o aprobada formalmente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/ausencias/{ausencia_id}/justificante:
    post:
      tags:
        - Ausencias
      summary: Subir archivo justificante de la ausencia
      description: Adjunta el documento justificativo oficial (PDF, imagen) a una ausencia de tipo genérica.
      operationId: subirJustificanteAusencia
      security:
        - bearerAuth: []
      parameters:
        - name: ausencia_id
          in: path
          required: true
          description: Identificador de la ausencia
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
                  description: Fichero del justificante (PDF, JPG, PNG)
              required:
                - archivo
      responses:
        '200':
          description: Justificante adjuntado correctamente.
          content:
            application/json:
