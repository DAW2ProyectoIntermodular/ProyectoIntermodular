                $ref: '#/components/schemas/Ausencia'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/ausencias/{ausencia_id}/pdf:
    get:
      tags:
        - Ausencias
      summary: Descargar documento PDF oficial de la ausencia
      description: |
        Genera al vuelo o descarga el documento PDF oficial normalizado de la ausencia docente
        con los datos personales precargados, motivos, firmas e identidad visual del IES Ramón Arcas Meca.
      operationId: descargarPdfAusencia
      security:
