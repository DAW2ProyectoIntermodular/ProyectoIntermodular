                $ref: '#/components/schemas/Retraso'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    delete:
      tags:
        - Retrasos
      summary: Eliminar registro de retraso
      description: Elimina una anotación errónea de impuntualidad.
      operationId: eliminarRetraso
      security:
        - bearerAuth: []
      parameters:
        - name: retraso_id
          in: path
          required: true
          description: Identificador del retraso
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '204':
          description: Retraso eliminado exitosamente.
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  # =========================================================================
