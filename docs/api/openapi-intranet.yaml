  # =========================================================================
  # 19. DASHBOARD DIRECTIVO (/api/v1/dashboard)
  # =========================================================================
  /api/v1/dashboard/kpis:
    get:
      tags:
        - Dashboard Directivo
      summary: Obtener los 9 KPIs obligatorios del centro
      description: |
        Devuelve el cuadro de mando ejecutivo consolidado para el Equipo Directivo, con los 9 KPIs reglamentarios:
        1. Tasa de abandono por curso escolar.
        2. Rendimiento académico agregado por grupo.
        3. Retrasos por grupo (con alumnos que superan el umbral).
        4. Ausencias acumuladas del profesorado.
        5. Ratio FEM de empresas activas vs registradas (por municipio y ciclo).
        6. Progreso FEM de horas cursadas sobre 500 horas.
        7. Publicaciones de difusión en redes sociales por departamento y porcentaje publicado.
        8. Uso y derivaciones al aula de convivencia.
        9. Comisiones de servicio autorizadas y liquidadas.
        Acceso restringido a rol `direccion` o `administrador`.
      operationId: obtenerKPIsDirectivos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conjunto de los 9 KPIs directivos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardKPIs'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'

  /api/v1/dashboard/kpis/{kpi_nombre}:
    get:
      tags:
        - Dashboard Directivo
      summary: Obtener datos detallados de un KPI específico
      description: Devuelve el desglose analítico en profundidad de una métrica concreta del cuadro directivo.
      operationId: obtenerKPIDetalladoPorNombre
      security:
        - bearerAuth: []
      parameters:
        - name: kpi_nombre
          in: path
          required: true
          description: Nombre canónico de la métrica KPI
          schema:
            type: string
            enum:
              - abandono_curso
              - rendimiento_grupo
              - retrasos_grupo
              - ausencias_profesorado
              - fem_empresas_ratio
              - fem_horas_500h
              - publicaciones_rrss
              - uso_convivencia
              - comisiones_servicio
            example: retrasos_grupo
      responses:
        '200':
          description: Datos desglosados del KPI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kpi:
                    type: string
                    example: retrasos_grupo
                  descripcion:
                    type: string
                    example: Desglose por grupo y listado de alumnos que exceden el umbral configurado.
                  datos:
                    type: object
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/dashboard/configuracion:
    get:
      tags:
        - Dashboard Directivo
      summary: Consultar umbrales configurables del dashboard
      description: Obtiene los parámetros de alerta (p.ej. límite de retrasos para alerta tutorial, umbral de abandono).
      operationId: obtenerConfiguracionDashboard
      security:
