  # =========================================================================
  # 9. AUSENCIAS (/api/v1/ausencias)
  # =========================================================================
  /api/v1/ausencias:
    get:
      tags:
        - Ausencias
      summary: Listar ausencias docentes
      description: Consulta las ausencias registradas con filtros por profesor, tipo, rango de fechas y estado.
      operationId: listarAusencias
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: query
          required: false
          description: Filtrar por profesor ausente
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
        - name: tipo
          in: query
          required: false
          description: Tipo de ausencia
          schema:
            type: string
            enum: [generica, administrativa, extraescolar]
            example: generica
        - name: estado
          in: query
          required: false
          description: Estado del trámite de ausencia
          schema:
            type: string
            enum: [pendiente, aprobada, rechazada, justificada]
            example: pendiente
        - name: fecha_desde
          in: query
          required: false
          description: Fecha de inicio del filtro (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-01"
        - name: fecha_hasta
          in: query
          required: false
          description: Fecha final del filtro (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-31"
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista paginada de ausencias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAusencias'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'
    post:
      tags:
        - Ausencias
      summary: Registrar nueva ausencia docente
      description: |
        Registra una ausencia comunicada por un docente (día completo o tramos horarios).
        Si el tipo es `extraescolar`, se marcarán automáticamente como ausentes los profesores acompañantes.
        Dispara la generación automática del documento PDF oficial y notifica a Jefatura de Estudios.
      operationId: registrarAusencia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AusenciaCrear'
      responses:
        '201':
          description: Ausencia registrada. Devuelve el identificador y Location.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ausencia'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '409':
          description: Ya existe una ausencia solapada registrada para ese profesor en esas fechas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/ausencias/me:
    get:
      tags:
        - Ausencias
      summary: Consultar mis ausencias
      description: Devuelve el histórico y solicitudes de ausencia del docente autenticado.
      operationId: listarMisAusencias
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaginaParam'
        - $ref: '#/components/parameters/LimiteParam'
      responses:
        '200':
          description: Lista de ausencias del docente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAusencias'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '422':
          $ref: '#/components/responses/Respuesta422'

  /api/v1/ausencias/{ausencia_id}:
    get:
      tags:
        - Ausencias
      summary: Detalle de una ausencia
      description: Obtiene la información detallada de la ausencia, estado del justificante y firma.
      operationId: obtenerAusenciaPorId
      security:
        - bearerAuth: []
      parameters:
        - name: ausencia_id
          in: path
          required: true
          description: Identificador de la ausencia
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      responses:
        '200':
          description: Detalle de la ausencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ausencia'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '422':
          $ref: '#/components/responses/Respuesta422'
    patch:
      tags:
        - Ausencias
      summary: Modificar estado o justificación de ausencia
      description: Permite a Jefatura de Estudios aprobar/rechazar o al docente aportar el motivo de justificación.
      operationId: actualizarEstadoAusencia
      security:
        - bearerAuth: []
      parameters:
        - name: ausencia_id
          in: path
          required: true
          description: Identificador de la ausencia
          schema:
            type: string
            example: 660e1d8f1b2c3d4e5f6a7b8c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AusenciaPatch'
      responses:
        '200':
          description: Ausencia actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ausencia'
        '401':
          $ref: '#/components/responses/Respuesta401'
        '403':
          $ref: '#/components/responses/Respuesta403'
        '404':
          $ref: '#/components/responses/Respuesta404'
        '409':
          description: Transición de estado no autorizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetalle'
        '422':
          $ref: '#/components/responses/Respuesta422'
    delete:
      tags:
        - Ausencias
      summary: Cancelar o anular solicitud de ausencia
      description: Cancela una ausencia pendiente antes de su fecha efectiva.
      operationId: cancelarAusencia
      security:
        - bearerAuth: []
      parameters:
        - name: ausencia_id
          in: path
          required: true
          description: Identificador de la ausencia
          schema:
            type: string
