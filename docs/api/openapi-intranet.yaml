    # -----------------------------------------------------------------------
    # MODELO: DASHBOARD DIRECTIVO (LOS 9 KPIS OBLIGATORIOS)
    # -----------------------------------------------------------------------
    DashboardKPIs:
      type: object
      description: Cuadro de mando integral con los 9 KPIs directivos obligatorios de la intranet.
      properties:
        abandono_curso:
          type: object
          description: "KPI 1: Tasa de abandono escolar agrupada por curso"
          properties:
            tasa_global_porcentaje:
              type: number
              example: 4.8
            por_curso:
              type: array
              items:
                type: object
                properties:
                  curso:
                    type: string
                    example: "1º DAW"
                  matriculados:
                    type: integer
                    example: 30
                  abandonos:
                    type: integer
                    example: 2
                  porcentaje:
                    type: number
                    example: 6.67
        rendimiento_grupo:
          type: object
          description: "KPI 2: Rendimiento académico agregado por grupo formativo"
          properties:
            nota_media_centro:
              type: number
              example: 7.2
            por_grupo:
              type: array
              items:
                type: object
                properties:
                  grupo:
                    type: string
                    example: "2º DAW"
                  aprobados_porcentaje:
                    type: number
                    example: 88.5
                  nota_media:
                    type: number
                    example: 7.6
        retrasos_grupo:
          type: object
          description: "KPI 3: Retrasos por grupo y estudiantes que superan el umbral"
          properties:
            total_retrasos_mes:
              type: integer
              example: 42
            alumnos_superan_umbral:
              type: array
              items:
                type: object
                properties:
                  alumno_id:
                    type: string
                    example: "ALUM-2026-042"
                  alumno_nombre:
                    type: string
                    example: "Alejandro Ruiz Navarro"
                  grupo:
                    type: string
                    example: "DAW2"
                  total_retrasos:
                    type: integer
                    example: 8
                  umbral_configurado:
                    type: integer
                    example: 5
        ausencias_profesorado:
          type: object
          description: "KPI 4: Ausencias acumuladas del profesorado"
          properties:
            horas_ausencia_total_mes:
              type: integer
              example: 38
            porcentaje_guardias_cubiertas:
              type: number
              example: 97.4
            desglose_por_tipo:
              type: object
              properties:
                generica:
                  type: integer
                  example: 18
                administrativa:
                  type: integer
                  example: 8
                extraescolar:
                  type: integer
                  example: 12
        fem_empresas_ratio:
          type: object
          description: "KPI 5: Ratio FEM de empresas activas vs registradas por municipio y ciclo"
          properties:
            total_empresas_registradas:
              type: integer
              example: 28
            total_empresas_activas:
              type: integer
              example: 22
            porcentaje_activas:
              type: number
              example: 78.57
            por_municipio:
              type: array
              items:
                type: object
                properties:
                  municipio:
                    type: string
                    example: "Totana"
                  activas:
                    type: integer
                    example: 14
                  total:
                    type: integer
                    example: 16
        fem_horas_500h:
          type: object
          description: "KPI 6: Porcentaje de horas cursadas en FEM sobre las 500 horas previstas"
          properties:
            promedio_horas_alumnado:
              type: number
              example: 310.5
            porcentaje_progreso_global:
              type: number
              example: 62.1
            alumnos_completados:
              type: integer
              example: 8
            alumnos_en_curso:
              type: integer
              example: 24
        publicaciones_rrss:
          type: object
          description: "KPI 7: Publicaciones RRSS por departamento y tasa de publicación efectiva"
          properties:
            total_solicitudes:
              type: integer
              example: 19
            total_publicadas:
              type: integer
              example: 16
            porcentaje_publicado:
              type: number
              example: 84.2
            por_departamento:
              type: array
              items:
                type: object
                properties:
                  departamento:
                    type: string
                    example: "Informática"
                  solicitadas:
                    type: integer
                    example: 10
                  publicadas:
                    type: integer
                    example: 9
        uso_convivencia:
          type: object
          description: "KPI 8: Estadísticas de uso y asistencia al aula de convivencia"
          properties:
            derivaciones_mes:
              type: integer
              example: 14
            tasa_asistencia_porcentaje:
              type: number
              example: 92.8
            tramos_mayor_frecuencia:
              type: array
              items:
                type: integer
              example: [3, 4]
        comisiones_servicio:
          type: object
          description: "KPI 9: Comisiones de servicio gestionadas y presupuesto liquidado"
          properties:
            total_solicitadas:
              type: integer
              example: 16
            total_aprobadas:
              type: integer
              example: 15
            gasto_total_liquidado:
              type: number
              example: 412.80
      required:
        - abandono_curso
        - rendimiento_grupo
        - retrasos_grupo
        - ausencias_profesorado
        - fem_empresas_ratio
        - fem_horas_500h
        - publicaciones_rrss
        - uso_convivencia
        - comisiones_servicio

