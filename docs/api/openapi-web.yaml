openapi: 3.1.0
info:
  title: API Web Pública y Backoffice - IES Ramón Arcas Meca
  description: |
    Especificación OpenAPI 3.1 oficial para la **Web Pública del Centro Educativo** y su **Backoffice de Administración** del **IES Ramón Arcas Meca** (Totana, Región de Murcia).
    
    ### Principios Arquitectónicos y Convenciones REST
    - **Backend:** PHP nativo sin framework (descartado Laravel), base de datos relacional MySQL / MariaDB normalizada en 3FN mínimo con integridad referencial (claves foráneas) y relaciones N:M.
    - **Autenticación:**
      - **API Pública:** Libre de autenticación para facilitar el consumo abierto, renderizado web e indexación por buscadores.
      - **API Backoffice (`/api/v1/admin/*`):** Autenticación mediante sesiones seguras con cookie HTTP estándar de PHP (`PHPSESSID`). No utiliza JWT.
    - **Prefijo y versionado:** Todas las rutas incorporan el prefijo `/api/v1` (salvo el endpoint SEO estándar en raíz `/sitemap.xml`).
    - **Rutas y nomenclatura:** Sustantivos en plural, minúsculas y completamente en **español** (`/api/v1/noticias`, `/api/v1/departamentos`, `/api/v1/programas`, `/api/v1/ensenanzas`, etc.).
    - **Paginación uniforme:** Parámetros de consulta `?page=1&limit=10` (por defecto `page=1`, `limit=10`, máximo `50`).
      Estructura de respuesta: `{"items": [...], "page": 1, "limit": 10, "total": N}`.
    - **Gestión de errores:** Formato canónico uniforme `{"detail": "..."}` en todos los códigos de error HTTP.
    - **Semántica HTTP:**
      - `GET`: Consulta de recursos sin efectos secundarios.
      - `POST`: Creación de recursos (responde `201 Created` con cabecera `Location` y objeto completo en el cuerpo) o ejecución de acciones administrativas no CRUD.
      - `PUT`: Sustitución completa del recurso o colecciones asociadas (relaciones N:M).
      - `PATCH`: Modificación parcial de estado (publicar/despublicar, visibilidad, estados de secretaría).
      - `DELETE`: Eliminación lógica o física devolviendo `204 No Content`.
    - **Códigos de estado soportados:** `200 OK`, `201 Created`, `204 No Content`, `401 Unauthorized`, `403 Forbidden`, `404 Not Found`, `409 Conflict`, `422 Unprocessable Entity`.
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo DAW2 - IES Ramón Arcas Meca
    email: informatica@iesramonarcasmeca.es
    url: https://www.iesramonarcasmeca.es
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo local (PHP CLI Server / Apache / Docker)
  - url: https://www.iesramonarcasmeca.es
    description: Servidor de producción oficial

tags:
  - name: Navegación
    description: Consulta del árbol de navegación y estructura jerárquica del portal público
  - name: Secciones
    description: Páginas y secciones informativas públicas del centro
  - name: Noticias
    description: Blog de actualidad, comunicados y noticias destacadas
  - name: Departamentos
    description: Fichas de departamentos didácticos y materias adscritas
  - name: Programas
    description: Planes de centro, proyectos institucionales (Erasmus+, Bilingüe, etc.) y relación N:M con departamentos
  - name: Enseñanzas
    description: Oferta formativa oficial (ESO, Bachillerato, FP Básica, Media y Superior) y materias optativas
  - name: Personas
    description: Directorio de personas (Equipo directivo, claustro de profesores y consejo escolar)
  - name: Documentos
    description: Repositorio público de documentos normativos, institucionales y para familias
  - name: Configuración
    description: Parámetros generales y datos de contacto del centro educativo
  - name: Secretaría
    description: Solicitud telemática de citas previas y trámites administrativos de secretaría
  - name: Contacto
    description: Buzón de quejas, sugerencias y felicitaciones de la comunidad educativa
  - name: SEO
    description: Metadatos para indexación por motores de búsqueda (sitemap.xml)
  - name: Admin - Autenticación
    description: Gestión de sesión del panel de administración del backoffice (cookie PHPSESSID)
  - name: Admin - Noticias
    description: Gestión editorial integral de noticias y comunicados (borradores y publicación)
  - name: Admin - Documentos
    description: Subida, categorización y mantenimiento de documentos del centro
  - name: Admin - Secciones
    description: Creación, ordenación y visibilidad de secciones del portal web
  - name: Admin - Personas
    description: Gestión del claustro, equipo directivo y miembros del consejo escolar
  - name: Admin - Departamentos
    description: Mantenimiento de departamentos didácticos y jefaturas
  - name: Admin - Programas
    description: Gestión de planes y vinculación N:M con departamentos participantes
  - name: Admin - Enseñanzas
    description: Mantenimiento de planes de estudio y materias optativas
  - name: Admin - Secretaría
    description: Tramitación, control de citas y cambio de estados administrativos
  - name: Admin - Configuración
    description: Actualización de la información global y canales de comunicación del centro

paths:
  # =========================================================================
  # 1. NAVEGACIÓN
  # =========================================================================
  /api/v1/navegacion/menu:
    get:
      tags:
        - Navegación
      summary: Obtener árbol jerárquico del menú de navegación
      description: |
        Devuelve la estructura arborescente completa del menú del portal público.
        Incluye secciones de nivel principal y sus subsecciones anidadas recursivamente según su jerarquía (`padre_id`) y orden visual configurado.
      operationId: obtenerMenuNavegacion
      responses:
        '200':
          description: Árbol del menú obtenido correctamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeccionArbol'
                example:
                  - seccion_id: 1
                    padre_id: null
                    titulo: "Organización"
                    slug: "organizacion"
                    orden: 1
                    visible: true
                    enlace_externo: null
                    hijos:
                      - seccion_id: 2
                        padre_id: 1
                        titulo: "Equipo Directivo"
                        slug: "equipo-directivo"
                        orden: 1
                        visible: true
                        enlace_externo: null
                        hijos: []
                      - seccion_id: 3
                        padre_id: 1
                        titulo: "Claustro de Profesores"
                        slug: "claustro-profesores"
                        orden: 2
                        visible: true
                        enlace_externo: null
                        hijos: []
                  - seccion_id: 4
                    padre_id: null
                    titulo: "Enseñanzas"
                    slug: "ensenanzas"
                    orden: 2
                    visible: true
                    enlace_externo: null
                    hijos:
                      - seccion_id: 5
                        padre_id: 4
                        titulo: "Formación Profesional"
                        slug: "formacion-profesional"
                        orden: 1
                        visible: true
                        enlace_externo: null
                        hijos: []
        '500':
          description: Error interno del servidor al procesar la jerarquía del menú.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =========================================================================
  # 2. SECCIONES
  # =========================================================================
  /api/v1/secciones:
    get:
      tags:
        - Secciones
      summary: Listar secciones públicas paginadas
      description: |
        Retorna la lista de secciones públicas visibles. Permite filtrar por `padre_id` (para obtener subsecciones directas o secciones raíz pasando `padre_id=null`).
      operationId: listarSeccionesPublicas
      parameters:
        - name: padre_id
          in: query
          required: false
          description: Filtrar por identificador de sección padre. Si se omite, devuelve todas las secciones de primer y segundo nivel.
          schema:
            type: integer
          example: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista paginada de secciones públicas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSecciones'
              example:
                items:
                  - seccion_id: 2
                    padre_id: 1
                    titulo: "Equipo Directivo"
                    slug: "equipo-directivo"
                    orden: 1
                    visible: true
                    contenido_html: "<p>Conoce a los miembros del equipo directivo del IES Ramón Arcas Meca.</p>"
                    enlace_externo: null
                    creado_en: "2026-09-01T08:00:00Z"
                    actualizado_en: "2026-09-10T11:30:00Z"
                  - seccion_id: 3
                    padre_id: 1
                    titulo: "Consejo Escolar"
                    slug: "consejo-escolar"
                    orden: 2
                    visible: true
                    contenido_html: "<p>Composición y funciones del Consejo Escolar durante el curso 2026/2027.</p>"
                    enlace_externo: null
                    creado_en: "2026-09-01T08:00:00Z"
                    actualizado_en: "2026-09-15T09:20:00Z"
                page: 1
                limit: 10
                total: 18
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/secciones/{seccion_id}:
    get:
      tags:
        - Secciones
      summary: Obtener detalle de una sección por su identificador numérico
      description: Devuelve el contenido completo y metadatos de una sección pública específica identificada por su ID primario.
      operationId: obtenerSeccionPorId
      parameters:
        - name: seccion_id
          in: path
          required: true
          description: Identificador único numérico de la sección.
          schema:
            type: integer
          example: 2
      responses:
        '200':
          description: Detalle completo de la sección.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeccionDetalle'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/secciones/{slug}:
    get:
      tags:
        - Secciones
      summary: Obtener detalle de una sección por su slug amigable
      description: Permite localizar y mostrar el contenido enriquecido de una sección a través de su slug amigable para optimización SEO.
      operationId: obtenerSeccionPorSlug
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug alfanumérico amigable de la sección (ej. 'equipo-directivo', 'proyecto-educativo').
          schema:
            type: string
          example: "equipo-directivo"
      responses:
        '200':
          description: Detalle completo de la sección encontrada por slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeccionDetalle'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  # =========================================================================
  # 3. NOTICIAS
  # =========================================================================
  /api/v1/noticias:
    get:
      tags:
        - Noticias
      summary: Listar noticias publicadas
      description: |
        Consulta las noticias públicas en estado `publicada`.
        Permite filtrar por noticias destacadas en portada (`destacada=true`) y categorización temática.
      operationId: listarNoticiasPublicas
      parameters:
        - name: destacada
          in: query
          required: false
          description: Filtrar exclusivamente noticias fijadas como destacadas en portada.
          schema:
            type: boolean
          example: true
        - name: categoria
          in: query
          required: false
          description: Filtrar por categoría informativa (ej. 'Admisión', 'Erasmus', 'Actividades', 'Institucional').
          schema:
            type: string
          example: "Admisión"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Listado paginado de noticias públicas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNoticias'
              example:
                items:
                  - noticia_id: 101
                    titulo: "Apertura del periodo de admisión para Ciclos Formativos 2026/2027"
                    slug: "apertura-admision-ciclos-formativos-2026-2027"
                    resumen: "Plazos, baremos y presentación telemática para Ciclos de FP Básica, Grado Medio y Superior."
                    cuerpo_html: "<p>La Consejería de Educación ha publicado el calendario oficial de escolarización...</p>"
                    imagen_portada: "/uploads/noticias/admision-fp-2026.webp"
                    destacada: true
                    estado: "publicada"
                    fecha_publicacion: "2026-09-01T09:00:00Z"
                    autor_nombre: "Equipo Directivo"
                    categoria: "Admisión"
                    creado_en: "2026-08-28T10:15:00Z"
                    actualizado_en: "2026-09-01T09:00:00Z"
                page: 1
                limit: 10
                total: 24
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/noticias/{slug}:
    get:
      tags:
        - Noticias
      summary: Obtener detalle de una noticia por slug
      description: Recupera el artículo completo de una noticia publicada mediante su URL amigable (slug).
      operationId: obtenerNoticiaPorSlug
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug representativo de la noticia.
          schema:
            type: string
          example: "apertura-admision-ciclos-formativos-2026-2027"
      responses:
        '200':
          description: Noticia encontrada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticiaDetalle'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  # =========================================================================
  # 4. DEPARTAMENTOS
  # =========================================================================
  /api/v1/departamentos:
    get:
      tags:
        - Departamentos
      summary: Listar departamentos didácticos
      description: Retorna la relación de todos los departamentos didácticos y de orientación del IES Ramón Arcas Meca.
      operationId: listarDepartamentosPublicos
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista paginada de departamentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartamentos'
              example:
                items:
                  - departamento_id: 1
                    nombre: "Informática y Comunicaciones"
                    slug: "informatica-y-comunicaciones"
                    jefe_departamento: "Dña. Carmen Morales Gil"
                    email: "informatica@iesramonarcasmeca.es"
                    ubicacion: "Edificio B, 2ª Planta, Despacho TIC"
                    descripcion: "Responsable de los ciclos formativos de Grado Básico, Medio y Superior de la familia profesional de Informática y materias optativas afines."
                    total_profesores: 14
                  - departamento_id: 2
                    nombre: "Matemáticas"
                    slug: "matematicas"
                    jefe_departamento: "D. Pedro Navarro López"
                    email: "matematicas@iesramonarcasmeca.es"
                    ubicacion: "Edificio A, 1ª Planta, Despacho 102"
                    descripcion: "Docencia y refuerzo en materias de matemáticas en ESO y Bachillerato."
                    total_profesores: 11
                page: 1
                limit: 10
                total: 16
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/departamentos/{departamento_id}:
    get:
      tags:
        - Departamentos
      summary: Obtener detalle de un departamento
      description: Devuelve la ficha completa de un departamento didáctico, incluyendo profesorado adscrito y materias impartidas.
      operationId: obtenerDepartamentoPorId
      parameters:
        - name: departamento_id
          in: path
          required: true
          description: Identificador numérico del departamento.
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Detalle del departamento didáctico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartamentoDetalle'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/departamentos/{departamento_id}/programas:
    get:
      tags:
        - Departamentos
      summary: Listar programas en los que participa un departamento (relación N:M)
      description: Devuelve la colección de programas institucionales y proyectos de centro en los que colabora activamente el departamento indicado.
      operationId: listarProgramasPorDepartamento
      parameters:
        - name: departamento_id
          in: path
          required: true
          description: Identificador del departamento didáctico.
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Listado de programas asociados al departamento.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramaResumen'
                example:
                  - programa_id: 1
                    nombre: "Erasmus+ Formación Profesional"
                    slug: "erasmus-plus-fp"
                    categoria: "educativo"
                    descripcion: "Movilidades formativas para prácticas en empresas europeas destinadas a alumnado de Ciclos Formativos."
                  - programa_id: 2
                    nombre: "Plan de Transformación Digital Educativa"
                    slug: "plan-digital-centro"
                    categoria: "plan_centro"
                    descripcion: "Implantación de metodologías activas y digitalización de aulas mediante dotación tecnológica."
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  # =========================================================================
  # 5. PROGRAMAS
  # =========================================================================
  /api/v1/programas:
    get:
      tags:
        - Programas
      summary: Listar programas y planes del centro
      description: |
        Consulta los más de 20 planes y proyectos institucionales del centro educativo.
        Permite filtrar por categoría (`educativo`, `plan_centro`, `actividad`).
      operationId: listarProgramasPublicos
      parameters:
        - name: categoria
          in: query
          required: false
          description: Categoría del programa educativo.
          schema:
            type: string
            enum: [educativo, plan_centro, actividad]
          example: "educativo"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista paginada de programas y planes del centro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProgramas'
              example:
                items:
                  - programa_id: 1
                    nombre: "Erasmus+ Proyectos Europeos"
                    slug: "erasmus-plus"
                    categoria: "educativo"
                    descripcion: "Programa de internacionalización con movilidades para alumnado de FP y profesorado en centros de la Unión Europea."
                    coordinador: "D. Juan Antonio Ruiz Alarcón"
                    documento_url: "/api/v1/documentos/12"
                    activo: true
                    departamentos_participantes:
                      - departamento_id: 1
                        nombre: "Informática y Comunicaciones"
                        slug: "informatica-y-comunicaciones"
                      - departamento_id: 4
                        nombre: "Inglés"
                        slug: "ingles"
                page: 1
                limit: 10
                total: 21
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/programas/{programa_id}:
    get:
      tags:
        - Programas
      summary: Obtener detalle de un programa educativo
      description: Muestra la información descriptiva de un programa, coordinador responsable, departamentos involucrados (N:M) y documentación asociada.
      operationId: obtenerProgramaPorId
      parameters:
        - name: programa_id
          in: path
          required: true
          description: Identificador numérico del programa.
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Detalle completo del programa educativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramaDetalle'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  # =========================================================================
  # 6. ENSEÑANZAS
  # =========================================================================
  /api/v1/ensenanzas:
    get:
      tags:
        - Enseñanzas
      summary: Listar oferta de enseñanzas oficiales
      description: Consulta las distintas etapas educativas impartidas en el centro (ESO, Bachillerato, FP Básica, CFGM, CFGS).
      operationId: listarEnsenanzasPublicas
      parameters:
        - name: etapa
          in: query
          required: false
          description: Filtrar por etapa educativa.
          schema:
            type: string
            enum: [eso, bachillerato, fp_basica, fp_grado_medio, fp_grado_superior]
          example: "fp_grado_superior"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Lista paginada de enseñanzas oficiales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnsenanzas'
              example:
                items:
                  - ensenanza_id: 10
                    nombre: "CFGS Desarrollo de Aplicaciones Web (DAW)"
                    slug: "cfgs-desarrollo-aplicaciones-web-daw"
                    etapa: "fp_grado_superior"
                    duracion_horas: 2000
                    curso_academico: "2026/2027"
                    descripcion: "Formación profesional superior orientada al desarrollo e integración de aplicaciones y servicios web modernos con tecnologías front-end y back-end."
                    titulacion: "Técnico Superior en Desarrollo de Aplicaciones Web"
                page: 1
                limit: 10
                total: 9
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/ensenanzas/{ensenanza_id}:
    get:
      tags:
        - Enseñanzas
      summary: Obtener detalle de una enseñanza
      description: Devuelve el currículo, perfil profesional, salidas laborales y módulos que componen la enseñanza seleccionada.
      operationId: obtenerEnsenanzaPorId
      parameters:
        - name: ensenanza_id
          in: path
          required: true
          description: Identificador numérico de la enseñanza.
          schema:
            type: integer
          example: 10
      responses:
        '200':
          description: Detalle completo de la enseñanza.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnsenanzaDetalle'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/ensenanzas/{ensenanza_id}/materias-optativas:
    get:
      tags:
        - Enseñanzas
      summary: Listar materias optativas de una enseñanza
      description: Consulta el catálogo de materias optativas o de libre configuración ofertadas en los distintos cursos de una etapa educativa.
      operationId: listarMateriasOptativasPorEnsenanza
      parameters:
        - name: ensenanza_id
          in: path
          required: true
          description: Identificador de la enseñanza.
          schema:
            type: integer
          example: 10
      responses:
        '200':
          description: Listado de materias optativas disponibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MateriaOptativa'
                example:
                  - materia_id: 101
                    ensenanza_id: 10
                    nombre: "Despliegue y Arquitectura en la Nube"
                    curso: "2º DAW"
                    horas_semanales: 4
                    descripcion: "Prácticas de orquestación con Docker, Kubernetes y pipelines CI/CD."
                  - materia_id: 102
                    ensenanza_id: 10
                    nombre: "Seguridad y Protección de Datos en Aplicaciones Web"
                    curso: "2º DAW"
                    horas_semanales: 3
                    descripcion: "Ciberseguridad aplicada, OWASP Top 10 y normativas RGPD/LOPDGDD."
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  # =========================================================================
  # 7. PERSONAS
  # =========================================================================
  /api/v1/personas:
    get:
      tags:
        - Personas
      summary: Listar directorio de personas del centro
      description: |
        Consulta el directorio del personal del centro.
        Permite segmentar por colectivo: `equipo_directivo`, `claustro` o `consejo_escolar`.
      operationId: listarPersonasPublicas
      parameters:
        - name: tipo
          in: query
          required: false
          description: Colectivo o ámbito de adscripción de la persona.
          schema:
            type: string
            enum: [equipo_directivo, claustro, consejo_escolar]
          example: "equipo_directivo"
        - name: departamento_id
          in: query
          required: false
          description: Filtrar docentes por departamento didáctico.
          schema:
            type: integer
          example: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Listado paginado de personas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPersonas'
              example:
                items:
                  - persona_id: 1
                    nombre: "Antonio"
                    apellidos: "Martínez Belmonte"
                    tipo: "equipo_directivo"
                    cargo: "Director"
                    departamento_id: 1
                    departamento_nombre: "Informática y Comunicaciones"
                    email: "direccion@iesramonarcasmeca.es"
                    foto_url: "/uploads/personas/director.webp"
                    orden: 1
                  - persona_id: 2
                    nombre: "Laura"
                    apellidos: "Gómez Sánchez"
                    tipo: "equipo_directivo"
                    cargo: "Jefa de Estudios"
                    departamento_id: 2
                    departamento_nombre: "Matemáticas"
                    email: "jefatura@iesramonarcasmeca.es"
                    foto_url: "/uploads/personas/jefa-estudios.webp"
                    orden: 2
                page: 1
                limit: 10
                total: 85
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/personas/{persona_id}:
    get:
      tags:
        - Personas
      summary: Obtener detalle de una persona
      description: Recupera la ficha personal, cargo, horarios de atención y datos públicos de contacto.
      operationId: obtenerPersonaPorId
      parameters:
        - name: persona_id
          in: path
          required: true
          description: Identificador numérico de la persona.
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Ficha de la persona localizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaDetalle'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  # =========================================================================
  # 8. DOCUMENTOS
  # =========================================================================
  /api/v1/documentos:
    get:
      tags:
        - Documentos
      summary: Listar documentos públicos
      description: |
        Consulta y descarga los documentos institucionales del centro, información para familias y anexos de programas.
        Filtros disponibles: `categoria` (`institucional`, `familias`, `programa`) y `seccion_id`.
      operationId: listarDocumentosPublicos
      parameters:
        - name: categoria
          in: query
          required: false
          description: Categoría del documento.
          schema:
            type: string
            enum: [institucional, familias, programa]
          example: "institucional"
        - name: seccion_id
          in: query
          required: false
          description: Filtrar documentos vinculados a una sección determinada.
          schema:
            type: integer
          example: 2
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Listado paginado de documentos públicos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentos'
              example:
                items:
                  - documento_id: 15
                    titulo: "Proyecto Educativo de Centro (PEC) 2026/2027"
                    descripcion: "Documento marco que establece los valores pedagógicos, modelo organizativo e identidad del IES Ramón Arcas Meca."
                    categoria: "institucional"
                    seccion_id: 2
                    archivo_url: "/uploads/documentos/pec-2026-2027.pdf"
                    tamanio_bytes: 3145728
                    tipo_mime: "application/pdf"
                    descargas: 142
                    creado_en: "2026-09-01T10:00:00Z"
                    actualizado_en: "2026-09-15T12:00:00Z"
                page: 1
                limit: 10
                total: 35
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/documentos/{documento_id}:
    get:
      tags:
        - Documentos
      summary: Obtener detalle y metadatos de un documento
      description: Devuelve los metadatos completos y la ruta de descarga directa del archivo solicitado, incrementando el contador de descargas.
      operationId: obtenerDocumentoPorId
      parameters:
        - name: documento_id
          in: path
          required: true
          description: Identificador único del documento.
          schema:
            type: integer
          example: 15
      responses:
        '200':
          description: Metadatos y enlace de descarga del documento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentoDetalle'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  # =========================================================================
  # 9. CONFIGURACIÓN DEL CENTRO
  # =========================================================================
  /api/v1/configuracion:
    get:
      tags:
        - Configuración
      summary: Obtener datos básicos de configuración del centro educativo
      description: |
        Retorna la ficha de configuración institucional del IES Ramón Arcas Meca:
        nombre oficial, código de centro, dirección física, teléfono, email general, horario de secretaría,
        coordenadas geográficas y enlaces a redes sociales oficiales.
      operationId: obtenerConfiguracionCentro
      responses:
        '200':
          description: Parámetros de configuración del centro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionCentro'
              example:
                nombre: "IES Ramón Arcas Meca"
                codigo_centro: "30006184"
                cif: "Q3068012A"
                direccion: "Alameda de Cervantes, s/n"
                codigo_postal: "30850"
                localidad: "Totana"
                provincia: "Murcia"
                telefono: "+34 968 42 12 34"
                email: "30006184@murciaeduca.es"
                horario_atencion: "Lunes a Viernes de 08:30 a 14:00"
                coordenadas:
                  latitud: 37.771234
                  longitud: -1.503456
                redes_sociales:
                  twitter: "https://twitter.com/iesramonarcas"
                  instagram: "https://instagram.com/iesramonarcas"
                  youtube: "https://youtube.com/c/IESRamonArcasMeca"
                  facebook: "https://facebook.com/iesramonarcasmeca"
                lema: "Educación pública, calidad, inclusión e innovación tecnológica"
        '500':
          description: Error interno al leer la configuración.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # =========================================================================
  # 10. SECRETARÍA
  # =========================================================================
  /api/v1/secretaria/citas:
    post:
      tags:
        - Secretaría
      summary: Solicitar cita previa en secretaría
      description: |
        Registra una nueva petición de cita previa telemática para ser atendido presencialmente en secretaría.
        Se crea automáticamente con estado inicial `pendiente` y genera un código de seguimiento único.
      operationId: solicitarCitaPrevia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCitaCrear'
      responses:
        '201':
          description: Solicitud de cita previa creada correctamente.
          headers:
            Location:
              description: URI para consultar el estado de la cita recién creada.
              schema:
                type: string
                example: "/api/v1/secretaria/citas/205/estado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudSecretaria'
        '409':
          description: Franja horaria ya ocupada o cita duplicada para el mismo solicitante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: "La franja horaria seleccionada ya no se encuentra disponible. Por favor, escoja otro horario."
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/secretaria/citas/{cita_id}/estado:
    get:
      tags:
        - Secretaría
      summary: Consultar estado de una cita previa
      description: Permite al solicitante comprobar el estado actual de su cita (`pendiente`, `en_curso`, `finalizado`, `cancelado`) utilizando el ID o código de seguimiento.
      operationId: consultarEstadoCitaPrevia
      parameters:
        - name: cita_id
          in: path
          required: true
          description: Identificador numérico o código de cita previa.
          schema:
            type: integer
          example: 205
      responses:
        '200':
          description: Información del estado de la cita.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudEstadoDetalle'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/secretaria/tramites:
    post:
      tags:
        - Secretaría
      summary: Iniciar trámite administrativo telemático
      description: |
        Permite a alumnos y tutores legales tramitar solicitudes de expedición de títulos, convalidaciones,
        certificados académicos o traslados de expediente.
        Se crea con estado inicial `pendiente`.
      operationId: iniciarTramiteAdministrativo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudTramiteCrear'
      responses:
        '201':
          description: Trámite administrativo iniciado satisfactoriamente.
          headers:
            Location:
              description: URI para consultar el estado del trámite.
              schema:
                type: string
                example: "/api/v1/secretaria/tramites/312/estado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudSecretaria'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/secretaria/tramites/{tramite_id}/estado:
    get:
      tags:
        - Secretaría
      summary: Consultar estado de un trámite administrativo
      description: Consulta pública del estado de resolución y observaciones de un trámite administrativo telemático.
      operationId: consultarEstadoTramite
      parameters:
        - name: tramite_id
          in: path
          required: true
          description: Identificador numérico del trámite.
          schema:
            type: integer
          example: 312
      responses:
        '200':
          description: Estado del trámite administrativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudEstadoDetalle'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  # =========================================================================
  # 11. CONTACTO Y BUZÓN
  # =========================================================================
  /api/v1/contacto/quejas-sugerencias:
    post:
      tags:
        - Contacto
      summary: Enviar queja, sugerencia o felicitación al centro
      description: |
        Buzón telemático oficial para el envío de quejas, sugerencias de mejora o felicitaciones por parte de familias,
        alumnos y vecinos de la comunidad educativa, cumpliendo la normativa de protección de datos (RGPD).
      operationId: enviarQuejaSugerencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuejaSugerenciaCrear'
      responses:
        '201':
          description: Mensaje recibido y registrado en el buzón.
          headers:
            Location:
              description: Identificador de acuse de recibo.
              schema:
                type: string
                example: "/api/v1/contacto/quejas-sugerencias/412"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuejaSugerencia'
        '422':
          $ref: '#/components/responses/Error422'

  # =========================================================================
  # 12. SEO
  # =========================================================================
  /sitemap.xml:
    get:
      tags:
        - SEO
      summary: Generar sitemap dinámico XML
      description: Devuelve el documento XML normalizado bajo el protocolo Sitemaps.org con todas las URLs públicas activas (secciones, noticias, enseñanzas y documentos) para indexación de Google y motores de búsqueda.
      operationId: obtenerSitemapXml
      responses:
        '200':
          description: Documento XML de sitemap generado dinámicamente.
          content:
            application/xml:
              schema:
                type: string
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
                  <url>
                    <loc>https://www.iesramonarcasmeca.es/</loc>
                    <lastmod>2026-10-15</lastmod>
                    <changefreq>daily</changefreq>
                    <priority>1.0</priority>
                  </url>
                  <url>
                    <loc>https://www.iesramonarcasmeca.es/noticias</loc>
                    <lastmod>2026-10-15</lastmod>
                    <changefreq>daily</changefreq>
                    <priority>0.8</priority>
                  </url>
                  <url>
                    <loc>https://www.iesramonarcasmeca.es/ensenanzas</loc>
                    <lastmod>2026-10-01</lastmod>
                    <changefreq>weekly</changefreq>
                    <priority>0.8</priority>
                  </url>
                </urlset>

  # =========================================================================
  # 13. AUTENTICACIÓN BACKOFFICE (PHPSESSID Cookie)
  # =========================================================================
  /api/v1/admin/auth/login:
    post:
      tags:
        - Admin - Autenticación
      summary: Iniciar sesión en el panel de administración
      description: |
        Autenticación de administradores y gestores de contenido mediante credenciales (email y contraseña con hash bcrypt/argon2id).
        En caso de éxito, inicia la sesión en el servidor PHP y devuelve la cabecera estándar `Set-Cookie: PHPSESSID=...; Path=/; HttpOnly; SameSite=Lax`.
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Autenticación satisfactoria. Se establece la cookie de sesión.
          headers:
            Set-Cookie:
              description: Cookie de sesión PHP con flags de seguridad.
              schema:
                type: string
                example: "PHPSESSID=ab12cd34ef56gh78ij90kl; Path=/; HttpOnly; SameSite=Lax"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          description: Credenciales erróneas o cuenta inactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: "Las credenciales introducidas no son válidas."
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/admin/auth/logout:
    post:
      tags:
        - Admin - Autenticación
      summary: Cerrar sesión en el panel de administración
      description: Destruye la sesión activa en el servidor y expira la cookie `PHPSESSID` en el navegador del cliente.
      operationId: logoutAdmin
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Sesión destruida exitosamente.
          headers:
            Set-Cookie:
              description: Invalida la cookie estableciendo fecha pasada.
              schema:
                type: string
                example: "PHPSESSID=deleted; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT"
        '401':
          $ref: '#/components/responses/Error401'

  /api/v1/admin/auth/me:
    get:
      tags:
        - Admin - Autenticación
      summary: Obtener perfil del administrador autenticado
      description: Devuelve los datos identificativos, rol administrativo y último acceso del usuario autenticado con la sesión en curso.
      operationId: obtenerAdminAutenticado
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Perfil del administrador actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsuario'
        '401':
          $ref: '#/components/responses/Error401'

  # =========================================================================
  # 14. ADMIN NOTICIAS
  # =========================================================================
  /api/v1/admin/noticias:
    get:
      tags:
        - Admin - Noticias
      summary: Listar todas las noticias (incluyendo borradores)
      description: Consulta el listado editorial completo de noticias. Permite filtrar por estado (`borrador`, `publicada`) y paginar resultados.
      operationId: listarNoticiasAdmin
      security:
        - cookieAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Estado editorial de la noticia.
          schema:
            type: string
            enum: [borrador, publicada]
          example: "borrador"
        - name: destacada
          in: query
          required: false
          schema:
            type: boolean
          example: false
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Listado administrativo de noticias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNoticias'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'

    post:
      tags:
        - Admin - Noticias
      summary: Crear una nueva noticia
      description: Da de alta un nuevo comunicado o noticia en el gestor de contenidos. Genera automáticamente el slug si no se aporta.
      operationId: crearNoticiaAdmin
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticiaCrear'
      responses:
        '201':
          description: Noticia creada exitosamente.
          headers:
            Location:
              description: URI del nuevo recurso.
              schema:
                type: string
                example: "/api/v1/admin/noticias/102"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          description: Conflicto por slug duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: "Ya existe una noticia registrada con ese slug. Indique uno diferente."
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/admin/noticias/{noticia_id}:
    get:
      tags:
        - Admin - Noticias
      summary: Obtener detalle de una noticia en administración
      description: Obtiene todos los campos de una noticia concreta mediante su ID interno para su edición.
      operationId: obtenerNoticiaAdminPorId
      security:
        - cookieAuth: []
      parameters:
        - name: noticia_id
          in: path
          required: true
          schema:
            type: integer
          example: 101
      responses:
        '200':
          description: Noticia encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticiaDetalle'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

    put:
      tags:
        - Admin - Noticias
      summary: Actualizar completamente una noticia
      description: Reemplaza la totalidad de los datos de una noticia existente.
      operationId: actualizarNoticiaAdmin
      security:
        - cookieAuth: []
      parameters:
        - name: noticia_id
          in: path
          required: true
          schema:
            type: integer
          example: 101
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticiaActualizar'
      responses:
        '200':
          description: Noticia actualizada completamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'

    delete:
      tags:
        - Admin - Noticias
      summary: Eliminar una noticia
      description: Borra permanentemente una noticia y elimina sus imágenes asociadas del servidor.
      operationId: eliminarNoticiaAdmin
      security:
        - cookieAuth: []
      parameters:
        - name: noticia_id
          in: path
          required: true
          schema:
            type: integer
          example: 101
      responses:
        '204':
          description: Noticia eliminada exitosamente.
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

    patch:
      tags:
        - Admin - Noticias
      summary: Modificar parcialmente una noticia (publicar/despublicar o destacar)
      description: Permite alternar de forma ágil el estado editorial (`borrador` / `publicada`) o marcar/desmarcar como destacada en portada sin enviar el cuerpo completo.
      operationId: modificarParcialNoticiaAdmin
      security:
        - cookieAuth: []
      parameters:
        - name: noticia_id
          in: path
          required: true
          schema:
            type: integer
          example: 101
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticiaParcial'
      responses:
        '200':
          description: Noticia modificada parcialmente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  # =========================================================================
  # 15. ADMIN DOCUMENTOS
  # =========================================================================
  /api/v1/admin/documentos:
    get:
      tags:
        - Admin - Documentos
      summary: Listar documentos en administración
      description: Consulta todos los documentos archivados en el centro con filtros avanzados por categoría y sección asociada.
      operationId: listarDocumentosAdmin
      security:
        - cookieAuth: []
      parameters:
        - name: categoria
          in: query
          required: false
          schema:
            type: string
            enum: [institucional, familias, programa]
        - name: seccion_id
          in: query
          required: false
          schema:
            type: integer
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Listado de documentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentos'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'

    post:
      tags:
        - Admin - Documentos
      summary: Subir y registrar un nuevo documento
      description: Registra un nuevo documento en el sistema, vinculando metadatos y la ruta al fichero PDF o multimedia subido.
      operationId: crearDocumentoAdmin
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentoCrear'
      responses:
        '201':
          description: Documento registrado correctamente.
          headers:
            Location:
              description: URI del documento recién creado.
              schema:
                type: string
                example: "/api/v1/admin/documentos/36"
          content:
