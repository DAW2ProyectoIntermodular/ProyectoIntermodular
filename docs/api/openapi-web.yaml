  /api/v1/admin/auth/login:
    post:
      tags:
      - Admin - Autenticación
      summary: Iniciar sesión en el panel de administración
      description: 'Autenticación de administradores y gestores de contenido mediante
        credenciales (email y contraseña con hash bcrypt/argon2id).

        En caso de éxito, inicia la sesión en el servidor PHP y devuelve la cabecera
        estándar `Set-Cookie: PHPSESSID=...; Path=/; HttpOnly; SameSite=Lax`.

        '
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Autenticación satisfactoria. Se establece la cookie de sesión.
          headers:
            Set-Cookie:
              description: Cookie de sesión PHP con flags de seguridad.
              schema:
                type: string
                examples:
                - PHPSESSID=ab12cd34ef56gh78ij90kl; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          description: Credenciales erróneas o cuenta inactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Las credenciales introducidas no son válidas.
        '422':
          $ref: '#/components/responses/Error422'
  /api/v1/admin/auth/logout:
    post:
      tags:
      - Admin - Autenticación
      summary: Cerrar sesión en el panel de administración
      description: Destruye la sesión activa en el servidor y expira la cookie `PHPSESSID`
        en el navegador del cliente.
      operationId: logoutAdmin
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Sesión destruida exitosamente.
          headers:
            Set-Cookie:
              description: Invalida la cookie estableciendo fecha pasada.
              schema:
                type: string
                examples:
                - PHPSESSID=deleted; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT
        '401':
          $ref: '#/components/responses/Error401'
  /api/v1/admin/auth/me:
