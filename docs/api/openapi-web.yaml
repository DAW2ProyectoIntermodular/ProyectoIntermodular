        '422':
          $ref: '#/components/responses/Error422'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: 'Autenticación de sesión en PHP mediante la cookie nativa `PHPSESSID`.

        Se adquiere tras enviar credenciales válidas a `POST /api/v1/admin/auth/login`.

        '
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Número de página actual (base 1).
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Cantidad máxima de registros devueltos por página (máximo 50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      example: 10
  responses:
    Error401:
      description: No autenticado. Sesión inexistente o cookie `PHPSESSID` expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Sesión no válida o expirada. Por favor, inicie sesión nuevamente.
    Error403:
      description: Acceso denegado. Permisos insuficientes para ejecutar esta operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: No dispone de los permisos necesarios para realizar esta acción.
    Error404:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: El recurso solicitado no fue encontrado en el servidor.
    Error409:
      description: Conflicto con el estado actual del recurso (duplicidad de claves
        únicas o conflicto relacional).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Ya existe un registro con el slug o código proporcionado.
    Error422:
      description: Error de validación en los campos enviados o parámetros de consulta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: 'Error de validación: el campo ''email'' no tiene un formato válido
              y ''titulo'' es obligatorio.'
  schemas:
    Error:
      type: object
      required:
      - detail
      properties:
        detail:
          type: string
          description: Mensaje descriptivo del error producido.
          examples:
          - El recurso solicitado no existe.
    Seccion:
      type: object
      required:
      - seccion_id
      - titulo
      - slug
      - orden
      - visible
      - creado_en
      - actualizado_en
      properties:
        seccion_id:
          type: integer
          description: Identificador único autoincremental de la sección.
          examples:
          - 2
        padre_id:
          type:
          - integer
          - 'null'
          description: Identificador de la sección padre (null si es de nivel raíz).
          examples:
          - 1
        titulo:
          type: string
          description: Título representativo de la sección.
          examples:
          - Equipo Directivo
        slug:
          type: string
          description: Cadena URL amigable única para SEO.
          examples:
          - equipo-directivo
        orden:
          type: integer
          description: Posición ordinal relativa entre secciones hermanas.
          examples:
          - 1
        visible:
          type: boolean
          description: Determina si se muestra en el menú público.
          examples:
          - true
        enlace_externo:
          type:
          - string
          - 'null'
          description: URL externa alternativa en caso de actuar como enlace fuera
            del portal.
          examples:
          - null
        creado_en:
          type: string
          format: date-time
          examples:
          - '2026-09-01T08:00:00Z'
        actualizado_en:
          type: string
          format: date-time
          examples:
          - '2026-09-10T11:30:00Z'
    SeccionDetalle:
      allOf:
      - $ref: '#/components/schemas/Seccion'
      - type: object
        properties:
          contenido_html:
            type:
            - string
            - 'null'
            description: Contenido enriquecido en HTML para su renderizado en la página.
            examples:
            - <div class='seccion-contenido'><h2>Equipo Directivo</h2><p>El equipo
              directivo coordina la acción pedagógica y administrativa del IES Ramón
              Arcas Meca.</p></div>
          subsecciones:
            type: array
            items:
              $ref: '#/components/schemas/Seccion'
    SeccionArbol:
      allOf:
      - $ref: '#/components/schemas/Seccion'
      - type: object
        properties:
          hijos:
            type: array
            description: Colección recursiva de subsecciones hijas.
            items:
              $ref: '#/components/schemas/SeccionArbol'
    SeccionCrear:
      type: object
      required:
      - titulo
      - orden
      properties:
        padre_id:
          type:
          - integer
          - 'null'
          examples:
          - 1
        titulo:
          type: string
          examples:
          - Secretaría y Trámites
        slug:
          type: string
          description: Opcional. Si se omite, el backend PHP lo autogenera a partir
            del título.
          examples:
          - secretaria-y-tramites
        contenido_html:
          type: string
          examples:
          - <p>Información general y trámites telemáticos de secretaría.</p>
        orden:
          type: integer
          examples:
          - 3
        visible:
          type: boolean
          default: true
          examples:
          - true
        enlace_externo:
          type:
          - string
          - 'null'
          examples:
          - null
    SeccionActualizar:
      type: object
      required:
      - titulo
      - slug
      - orden
      - visible
      properties:
        padre_id:
          type:
          - integer
          - 'null'
          examples:
          - 1
        titulo:
          type: string
          examples:
          - Secretaría y Trámites Actualizado
        slug:
          type: string
          examples:
          - secretaria-y-tramites
        contenido_html:
          type: string
          examples:
          - <p>Nuevo contenido de secretaría y trámites.</p>
        orden:
          type: integer
          examples:
          - 3
        visible:
          type: boolean
          examples:
          - true
        enlace_externo:
          type:
          - string
          - 'null'
          examples:
          - null
    SeccionParcial:
      type: object
      properties:
        visible:
          type: boolean
          examples:
          - false
        orden:
          type: integer
          examples:
          - 4
    PaginatedSecciones:
      type: object
      required:
      - items
      - page
      - limit
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Seccion'
        page:
          type: integer
          examples:
          - 1
        limit:
          type: integer
          examples:
          - 10
        total:
          type: integer
          examples:
          - 18
    Noticia:
      type: object
      required:
      - noticia_id
      - titulo
      - slug
      - resumen
      - destacada
      - estado
