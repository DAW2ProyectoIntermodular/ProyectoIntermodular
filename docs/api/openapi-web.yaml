  # =========================================================================
  # 21. ADMIN SECRETARÍA (GESTIÓN DE SOLICITUDES Y CITAS)
  # =========================================================================
  /api/v1/admin/secretaria/solicitudes:
    get:
      tags:
        - Admin - Secretaría
      summary: Listar solicitudes de secretaría (citas y trámites)
      description: |
        Consulta la cola de peticiones de secretaría. Permite filtrar por tipo (`cita` o `tramite`)
        y por estado (`pendiente`, `en_curso`, `finalizado`, `cancelado`).
      operationId: listarSolicitudesSecretariaAdmin
      security:
        - cookieAuth: []
      parameters:
        - name: tipo
          in: query
          required: false
          description: Filtrar por naturaleza de la petición.
          schema:
            type: string
            enum: [cita, tramite]
          example: "cita"
        - name: estado
          in: query
          required: false
          description: Filtrar por estado actual de tramitación.
          schema:
            type: string
            enum: [pendiente, en_curso, finalizado, cancelado]
          example: "pendiente"
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Cola de solicitudes paginada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSolicitudesSecretaria'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/admin/secretaria/solicitudes/{solicitud_id}:
    get:
      tags:
        - Admin - Secretaría
      summary: Obtener detalle de una solicitud de secretaría
      description: Consulta el expediente completo de una cita o trámite administrativo, incluyendo notas internas del gestor.
      operationId: obtenerSolicitudSecretariaAdminPorId
      security:
        - cookieAuth: []
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema:
            type: integer
          example: 205
      responses:
        '200':
          description: Detalle de la solicitud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudSecretaria'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'

    patch:
      tags:
        - Admin - Secretaría
      summary: Actualizar estado de una solicitud (transición de estados)
      description: |
        Avanza o actualiza el ciclo de vida de la solicitud:
        `pendiente` -> `en_curso` -> `finalizado` (o `cancelado`).
        Permite incorporar anotaciones de resolución o notas internas para secretaría.
      operationId: actualizarEstadoSolicitudSecretaria
      security:
        - cookieAuth: []
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema:
            type: integer
          example: 205
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudEstadoParcial'
      responses:
        '200':
          description: Estado de la solicitud actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudSecretaria'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          description: Transición de estado inválida (ej. intentar pasar de 'finalizado' a 'pendiente').
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: "Transición de estado no permitida. Una solicitud finalizada no puede retornar a pendiente."
        '422':
          $ref: '#/components/responses/Error422'

