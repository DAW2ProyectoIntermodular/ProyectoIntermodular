# ===========================================================================
# COMPONENTES REUTILIZABLES
# ===========================================================================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: |
        Autenticación de sesión en PHP mediante la cookie nativa `PHPSESSID`.
        Se adquiere tras enviar credenciales válidas a `POST /api/v1/admin/auth/login`.

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Número de página actual (base 1).
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    LimitParam:
      name: limit
      in: query
      required: false
      description: Cantidad máxima de registros devueltos por página (máximo 50).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      example: 10

  responses:
    Error401:
      description: No autenticado. Sesión inexistente o cookie `PHPSESSID` expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Sesión no válida o expirada. Por favor, inicie sesión nuevamente."

    Error403:
      description: Acceso denegado. Permisos insuficientes para ejecutar esta operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "No dispone de los permisos necesarios para realizar esta acción."

    Error404:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "El recurso solicitado no fue encontrado en el servidor."

    Error409:
      description: Conflicto con el estado actual del recurso (duplicidad de claves únicas o conflicto relacional).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Ya existe un registro con el slug o código proporcionado."

    Error422:
      description: Error de validación en los campos enviados o parámetros de consulta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Error de validación: el campo 'email' no tiene un formato válido y 'titulo' es obligatorio."

  schemas:
    # -----------------------------------------------------------------------
    # ESQUEMA DE ERROR ESTÁNDAR
    # -----------------------------------------------------------------------
    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Mensaje descriptivo del error producido.
          example: "El recurso solicitado no existe."

    # -----------------------------------------------------------------------
    # ESQUEMAS DE SECCIONES
    # -----------------------------------------------------------------------
    Seccion:
      type: object
      required:
        - seccion_id
        - titulo
        - slug
        - orden
        - visible
        - creado_en
        - actualizado_en
      properties:
        seccion_id:
          type: integer
          description: Identificador único autoincremental de la sección.
          example: 2
        padre_id:
          type: [integer, "null"]
          description: Identificador de la sección padre (null si es de nivel raíz).
          example: 1
        titulo:
          type: string
          description: Título representativo de la sección.
          example: "Equipo Directivo"
        slug:
          type: string
          description: Cadena URL amigable única para SEO.
          example: "equipo-directivo"
        orden:
          type: integer
          description: Posición ordinal relativa entre secciones hermanas.
          example: 1
        visible:
          type: boolean
          description: Determina si se muestra en el menú público.
          example: true
        enlace_externo:
          type: [string, "null"]
          description: URL externa alternativa en caso de actuar como enlace fuera del portal.
          example: null
        creado_en:
          type: string
          format: date-time
          example: "2026-09-01T08:00:00Z"
        actualizado_en:
          type: string
          format: date-time
          example: "2026-09-10T11:30:00Z"

    SeccionDetalle:
      allOf:
        - $ref: '#/components/schemas/Seccion'
        - type: object
          properties:
            contenido_html:
              type: [string, "null"]
              description: Contenido enriquecido en HTML para su renderizado en la página.
              example: "<div class='seccion-contenido'><h2>Equipo Directivo</h2><p>El equipo directivo coordina la acción pedagógica y administrativa del IES Ramón Arcas Meca.</p></div>"
            subsecciones:
              type: array
              items:
                $ref: '#/components/schemas/Seccion'

    SeccionArbol:
      allOf:
        - $ref: '#/components/schemas/Seccion'
        - type: object
          properties:
            hijos:
              type: array
              description: Colección recursiva de subsecciones hijas.
              items:
                $ref: '#/components/schemas/SeccionArbol'

    SeccionCrear:
      type: object
      required:
        - titulo
        - orden
      properties:
        padre_id:
          type: [integer, "null"]
          example: 1
        titulo:
          type: string
          example: "Secretaría y Trámites"
        slug:
          type: string
          description: Opcional. Si se omite, el backend PHP lo autogenera a partir del título.
          example: "secretaria-y-tramites"
        contenido_html:
          type: string
          example: "<p>Información general y trámites telemáticos de secretaría.</p>"
        orden:
          type: integer
          example: 3
        visible:
          type: boolean
          default: true
          example: true
        enlace_externo:
          type: [string, "null"]
          example: null

    SeccionActualizar:
      type: object
      required:
        - titulo
        - slug
        - orden
        - visible
      properties:
        padre_id:
          type: [integer, "null"]
          example: 1
        titulo:
          type: string
          example: "Secretaría y Trámites Actualizado"
        slug:
          type: string
          example: "secretaria-y-tramites"
        contenido_html:
          type: string
          example: "<p>Nuevo contenido de secretaría y trámites.</p>"
        orden:
          type: integer
          example: 3
        visible:
          type: boolean
          example: true
        enlace_externo:
          type: [string, "null"]
          example: null

    SeccionParcial:
      type: object
      properties:
        visible:
          type: boolean
          example: false
        orden:
          type: integer
          example: 4

    PaginatedSecciones:
      type: object
      required:
        - items
        - page
        - limit
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Seccion'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 18

    # -----------------------------------------------------------------------
    # ESQUEMAS DE NOTICIAS
    # -----------------------------------------------------------------------
    Noticia:
      type: object
      required:
        - noticia_id
        - titulo
        - slug
        - resumen
        - destacada
        - estado
        - categoria
        - creado_en
        - actualizado_en
      properties:
        noticia_id:
          type: integer
          example: 101
        titulo:
          type: string
          example: "Apertura del periodo de admisión para Ciclos Formativos 2026/2027"
        slug:
          type: string
          example: "apertura-admision-ciclos-formativos-2026-2027"
        resumen:
          type: string
          example: "Plazos, baremos y presentación telemática para Ciclos de FP Básica, Grado Medio y Superior."
        imagen_portada:
          type: [string, "null"]
          example: "/uploads/noticias/admision-fp-2026.webp"
        destacada:
          type: boolean
          example: true
        estado:
          type: string
          enum: [borrador, publicada]
          example: "publicada"
        fecha_publicacion:
          type: [string, "null"]
          format: date-time
          example: "2026-09-01T09:00:00Z"
        autor_nombre:
          type: string
          example: "Equipo Directivo"
        categoria:
          type: string
          example: "Admisión"
        creado_en:
          type: string
          format: date-time
          example: "2026-08-28T10:15:00Z"
        actualizado_en:
          type: string
          format: date-time
          example: "2026-09-01T09:00:00Z"

    NoticiaDetalle:
      allOf:
        - $ref: '#/components/schemas/Noticia'
        - type: object
          required:
            - cuerpo_html
          properties:
            cuerpo_html:
              type: string
              description: Texto completo enriquecido de la noticia en formato HTML.
              example: "<p>La Consejería de Educación ha publicado el calendario oficial de escolarización para el curso 2026/2027...</p>"

    NoticiaCrear:
      type: object
      required:
        - titulo
        - resumen
        - cuerpo_html
        - categoria
      properties:
        titulo:
          type: string
          example: "Nuevo convenio de prácticas Erasmus+ en Alemania"
        slug:
          type: string
          description: Opcional. Si se omite se genera desde el título.
          example: "nuevo-convenio-practicas-erasmus-alemania"
        resumen:
          type: string
          example: "Alumnos de 2º de DAW y DAM podrán realizar su FCT en empresas tecnológicas de Berlín."
        cuerpo_html:
          type: string
          example: "<p>El IES Ramón Arcas Meca amplía su consorcio Erasmus+ con tres nuevas empresas tecnológicas internacionales...</p>"
        imagen_portada:
          type: string
          example: "/uploads/noticias/erasmus-berlin.webp"
        destacada:
          type: boolean
          default: false
          example: false
        estado:
          type: string
          enum: [borrador, publicada]
          default: borrador
          example: "publicada"
        categoria:
          type: string
          example: "Erasmus"

    NoticiaActualizar:
