    patch:
      tags:
      - Admin - Secretaría
      summary: Actualizar estado de una solicitud (transición de estados)
      description: 'Avanza o actualiza el ciclo de vida de la solicitud:

        `pendiente` -> `en_curso` -> `finalizado` (o `cancelado`).

        Permite incorporar anotaciones de resolución o notas internas para secretaría.

        '
      operationId: actualizarEstadoSolicitudSecretaria
      security:
      - cookieAuth: []
      parameters:
      - name: solicitud_id
        in: path
        required: true
        schema:
          type: integer
        example: 205
        description: Identificador numérico único de la solicitud de secretaría (cita
          o trámite administrativo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
