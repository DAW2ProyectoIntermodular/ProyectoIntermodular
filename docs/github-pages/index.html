<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Docs — Proyecto Intermodular IES Ramón Arcas Meca</title>
    <meta name="description" content="Documentación interactiva de las APIs del Proyecto Intermodular: Intranet de Gestión Docente y Web Pública del Centro Educativo">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Swagger UI -->
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">

    <style>
        :root {
            --color-bg: #0a0a0b;
            --color-surface: #141416;
            --color-surface-2: #1c1c1f;
            --color-surface-3: #242428;
            --color-border: #2a2a2e;
            --color-text: #e8e8ed;
            --color-text-secondary: #8e8e93;
            --color-accent: #6366f1;
            --color-accent-hover: #818cf8;
            --color-green: #22c55e;
            --color-blue: #3b82f6;
            --color-orange: #f59e0b;
            --color-red: #ef4444;
            --color-cyan: #06b6d4;
            --color-purple: #a855f7;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
            --radius: 12px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, var(--color-surface) 0%, var(--color-surface-2) 100%);
            border-bottom: 1px solid var(--color-border);
            padding: 2rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-accent), var(--color-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title .badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            background: var(--color-accent);
            color: white;
            letter-spacing: 0.5px;
        }

        .header-nav {
            display: flex;
            gap: 0.5rem;
        }

        .header-nav a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }

        .header-nav a:hover, .header-nav a.active {
            background: var(--color-surface-3);
            color: var(--color-text);
        }

        /* ===== TABS ===== */
        .tabs-container {
            max-width: 1400px;
            margin: 2rem auto 0;
            padding: 0 2rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .tab-btn {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            background: var(--color-surface);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: var(--color-surface-2);
            color: var(--color-text);
            border-color: var(--color-surface-3);
        }

        .tab-btn.active {
            background: var(--color-accent);
            color: white;
            border-color: var(--color-accent);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* ===== CHEATSHEET ===== */
        .cheatsheet {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .cheatsheet-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .api-section {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .api-section-header {
            padding: 1rem 1.5rem;
            background: var(--color-surface-2);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            user-select: none;
        }

        .api-section-header:hover {
            background: var(--color-surface-3);
        }

        .api-section-header h3 {
            font-size: 1rem;
            font-weight: 600;
            flex: 1;
        }

        .api-section-header .count {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            background: var(--color-surface-3);
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
        }

        .api-section-header .chevron {
            color: var(--color-text-secondary);
            transition: transform 0.2s;
        }

        .api-section.collapsed .chevron {
            transform: rotate(-90deg);
        }

        .api-section.collapsed .api-section-body {
            display: none;
        }

        .api-section-body {
            padding: 0.5rem;
        }

        .endpoint-row {
            display: grid;
            grid-template-columns: 70px 1fr auto;
            align-items: center;
            gap: 1rem;
            padding: 0.6rem 1rem;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
        }

        .endpoint-row:hover {
            background: var(--color-surface-2);
        }

        .method-badge {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .method-GET { background: rgba(34, 197, 94, 0.15); color: var(--color-green); }
        .method-POST { background: rgba(59, 130, 246, 0.15); color: var(--color-blue); }
        .method-PUT { background: rgba(245, 158, 11, 0.15); color: var(--color-orange); }
        .method-PATCH { background: rgba(168, 85, 247, 0.15); color: var(--color-purple); }
        .method-DELETE { background: rgba(239, 68, 68, 0.15); color: var(--color-red); }

        .endpoint-path {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: var(--color-text);
        }

        .endpoint-path .param {
            color: var(--color-cyan);
        }

        .endpoint-desc {
            font-size: 0.78rem;
            color: var(--color-text-secondary);
            text-align: right;
            white-space: nowrap;
        }

        /* ===== SWAGGER CONTAINER ===== */
        .swagger-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .swagger-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .swagger-selector button {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.5rem 1.25rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-surface);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .swagger-selector button:hover {
            background: var(--color-surface-2);
            color: var(--color-text);
        }

        .swagger-selector button.active {
            background: var(--color-accent);
            color: white;
            border-color: var(--color-accent);
        }

        #swagger-ui-container {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1rem;
            min-height: 600px;
        }

        /* Swagger UI dark theme overrides */
        .swagger-ui {
            font-family: var(--font-sans) !important;
        }
        .swagger-ui .topbar { display: none !important; }
        .swagger-ui .info { margin: 20px 0 !important; }
        .swagger-ui .info .title { color: var(--color-text) !important; font-family: var(--font-sans) !important; }
        .swagger-ui .info .description p { color: var(--color-text-secondary) !important; }
        .swagger-ui .scheme-container { background: var(--color-surface-2) !important; border-radius: var(--radius-sm) !important; box-shadow: none !important; }
        .swagger-ui .opblock-tag { color: var(--color-text) !important; border-bottom-color: var(--color-border) !important; font-family: var(--font-sans) !important; }
        .swagger-ui .opblock { border-radius: var(--radius-sm) !important; border-color: var(--color-border) !important; background: var(--color-surface) !important; margin-bottom: 0.5rem !important; }
        .swagger-ui .opblock .opblock-summary { border-color: var(--color-border) !important; }
        .swagger-ui .opblock .opblock-summary-description { color: var(--color-text-secondary) !important; font-family: var(--font-sans) !important; }
        .swagger-ui .opblock .opblock-summary-path { color: var(--color-text) !important; font-family: var(--font-mono) !important; }
        .swagger-ui .opblock-body { background: var(--color-surface-2) !important; }
        .swagger-ui .opblock-section-header { background: var(--color-surface-3) !important; }
        .swagger-ui .opblock-section-header h4 { color: var(--color-text) !important; }
        .swagger-ui .model-box, .swagger-ui section.models { background: var(--color-surface) !important; border-color: var(--color-border) !important; }
        .swagger-ui .model { color: var(--color-text) !important; }
        .swagger-ui table thead tr th { color: var(--color-text) !important; border-color: var(--color-border) !important; }
        .swagger-ui table tbody tr td { color: var(--color-text-secondary) !important; border-color: var(--color-border) !important; }
        .swagger-ui .btn { border-radius: var(--radius-sm) !important; }
        .swagger-ui select { background: var(--color-surface-2) !important; color: var(--color-text) !important; border-color: var(--color-border) !important; }
        .swagger-ui input[type=text] { background: var(--color-surface-2) !important; color: var(--color-text) !important; border-color: var(--color-border) !important; }
        .swagger-ui textarea { background: var(--color-surface-2) !important; color: var(--color-text) !important; border-color: var(--color-border) !important; }
        .swagger-ui .response-col_status { color: var(--color-text) !important; }
        .swagger-ui .response-col_description { color: var(--color-text-secondary) !important; }
        .swagger-ui .responses-inner h4, .swagger-ui .responses-inner h5 { color: var(--color-text) !important; }
        .swagger-ui .parameter__name { color: var(--color-text) !important; }
        .swagger-ui .parameter__type { color: var(--color-text-secondary) !important; }
        .swagger-ui .model-title { color: var(--color-text) !important; }
        .swagger-ui section.models h4 { color: var(--color-text) !important; }

        /* ===== STATS BAR ===== */
        .stats-bar {
            max-width: 1400px;
            margin: 0 auto 2rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1.25rem;
            text-align: center;
        }

        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--color-accent), var(--color-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card .stat-label {
            font-size: 0.78rem;
            color: var(--color-text-secondary);
            margin-top: 0.25rem;
        }

        /* ===== FOOTER ===== */
        .footer {
            border-top: 1px solid var(--color-border);
            padding: 2rem;
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 0.8rem;
        }

        .footer a {
            color: var(--color-accent);
            text-decoration: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header-content { flex-direction: column; align-items: flex-start; }
            .header-nav { flex-wrap: wrap; }
            .tabs { flex-wrap: wrap; }
            .endpoint-row { grid-template-columns: 60px 1fr; }
            .endpoint-desc { display: none; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-content">
            <div class="header-title">
                <h1>🏫 Proyecto Intermodular API</h1>
                <span class="badge">v1.0</span>
            </div>
            <nav class="header-nav">
                <a href="#" class="active" onclick="showView('cheatsheet')">📋 Cheatsheet</a>
                <a href="#" onclick="showView('swagger')">🔧 Swagger UI</a>
                <a href="#" onclick="showView('redoc')">📖 Redoc</a>
                <a href="https://github.com/DAW2ProyectoIntermodular/ProyectoIntermodular" target="_blank">⚡ GitHub</a>
            </nav>
        </div>
    </header>

    <!-- MAIN TABS: Intranet vs Web -->
    <div class="tabs-container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchProject('intranet')">🔒 Intranet — Gestión Docente</button>
            <button class="tab-btn" onclick="switchProject('web')">🌐 Web Pública — Centro Educativo</button>
        </div>
    </div>

    <!-- STATS BAR -->
    <div class="stats-bar" id="stats-bar">
        <!-- Populated by JS -->
    </div>

    <!-- CHEATSHEET VIEW -->
    <div id="view-cheatsheet" class="cheatsheet">
        <div class="cheatsheet-grid" id="cheatsheet-content">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- SWAGGER VIEW -->
    <div id="view-swagger" class="swagger-container" style="display: none;">
        <div class="swagger-selector" id="swagger-api-selector">
            <button class="active" onclick="loadSwagger('intranet')">🔒 Intranet API</button>
            <button onclick="loadSwagger('web')">🌐 Web Pública API</button>
        </div>
        <div id="swagger-ui-container"></div>
    </div>

    <!-- REDOC VIEW -->
    <div id="view-redoc" class="swagger-container" style="display: none;">
        <div class="swagger-selector" id="redoc-api-selector">
            <button class="active" onclick="loadRedoc('intranet')">🔒 Intranet API</button>
            <button onclick="loadRedoc('web')">🌐 Web Pública API</button>
        </div>
        <div id="redoc-container" style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); min-height: 600px;"></div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p>Proyecto Intermodular — IES Ramón Arcas Meca — 2º DAW 2026/2027</p>
        <p>José Iver Peñarrieta &amp; Francisco Guerrero · <a href="https://github.com/DAW2ProyectoIntermodular">GitHub</a></p>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
        // ===========================
        // ENDPOINT DATA
        // ===========================
        const endpoints = {
            intranet: [
                {
                    section: "🔐 Autenticación",
                    endpoints: [
                        { method: "POST", path: "/api/v1/auth/login/google", desc: "Login con Google OAuth2" },
                        { method: "POST", path: "/api/v1/auth/refresh", desc: "Renovar access token" },
                        { method: "POST", path: "/api/v1/auth/logout", desc: "Cerrar sesión" },
                    ]
                },
                {
                    section: "👤 Usuarios",
                    endpoints: [
                        { method: "GET", path: "/api/v1/usuarios/me", desc: "Mi perfil" },
                        { method: "PUT", path: "/api/v1/usuarios/me", desc: "Actualizar mi perfil" },
                        { method: "GET", path: "/api/v1/usuarios", desc: "Listar usuarios (admin)" },
                        { method: "GET", path: "/api/v1/usuarios/{usuario_id}", desc: "Detalle usuario" },
                        { method: "POST", path: "/api/v1/usuarios", desc: "Crear usuario (admin)" },
                        { method: "PUT", path: "/api/v1/usuarios/{usuario_id}", desc: "Actualizar usuario" },
                        { method: "PATCH", path: "/api/v1/usuarios/{usuario_id}", desc: "Aprobar/cambiar estado" },
                        { method: "DELETE", path: "/api/v1/usuarios/{usuario_id}", desc: "Eliminar usuario" },
                        { method: "PUT", path: "/api/v1/usuarios/{usuario_id}/roles", desc: "Asignar roles" },
                    ]
                },
                {
                    section: "📢 Tablón de Anuncios",
                    endpoints: [
                        { method: "GET", path: "/api/v1/anuncios", desc: "Listar anuncios" },
                        { method: "POST", path: "/api/v1/anuncios", desc: "Crear anuncio" },
                        { method: "GET", path: "/api/v1/anuncios/{anuncio_id}", desc: "Detalle" },

                {

                        { method: "GET", path: "/api/v1/horarios/{usuario_id}", desc: "Horario de docente" },
                        { method: "POST", path: "/api/v1/horarios", desc: "Crear horario (admin)" },
                        { method: "PUT", path: "/api/v1/horarios/{usuario_id}", desc: "Reemplazar horario" },

                {

                        { method: "GET", path: "/api/v1/ausencias/me", desc: "Mis ausencias" },

                {

                },
                {

        let currentProject = 'intranet';

        let swaggerUI = null;

        function switchProject(project) {
            currentProject = project;
            document.querySelectorAll('.tabs .tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', (project === 'intranet' ? i === 0 : i === 1));
            });
            renderCheatsheet();
            renderStats();
        }

        function showView(view) {
            currentView = view;
            document.querySelectorAll('.header-nav a').forEach(a => a.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('view-cheatsheet').style.display = view === 'cheatsheet' ? '' : 'none';
            document.getElementById('view-swagger').style.display = view === 'swagger' ? '' : 'none';
            document.getElementById('view-redoc').style.display = view === 'redoc' ? '' : 'none';

            if (view === 'swagger') loadSwagger(currentProject);
            if (view === 'redoc') loadRedoc(currentProject);
        }

        function renderStats() {
            const data = endpoints[currentProject];
            const totalEndpoints = data.reduce((sum, s) => sum + s.endpoints.length, 0);
            const methods = {};
            data.forEach(s => s.endpoints.forEach(e => {
                methods[e.method] = (methods[e.method] || 0) + 1;
            }));

            document.getElementById('stats-bar').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalEndpoints}</div>
                    <div class="stat-label">Endpoints totales</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.length}</div>
                    <div class="stat-label">Módulos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${methods['GET'] || 0}</div>
                    <div class="stat-label">GET</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${methods['POST'] || 0}</div>
                    <div class="stat-label">POST</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${(methods['PUT'] || 0) + (methods['PATCH'] || 0)}</div>
                    <div class="stat-label">PUT / PATCH</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${methods['DELETE'] || 0}</div>
                    <div class="stat-label">DELETE</div>
                </div>
            `;
        }

        function renderCheatsheet() {
            const data = endpoints[currentProject];
            let html = '';
            data.forEach(section => {
                const pathsHTML = section.endpoints.map(e => {
                    const pathFormatted = e.path.replace(/\{([^}]+)\}/g, '<span class="param">{$1}</span>');
                    return `<div class="endpoint-row">
                        <span class="method-badge method-${e.method}">${e.method}</span>
                        <span class="endpoint-path">${pathFormatted}</span>
                        <span class="endpoint-desc">${e.desc}</span>
                    </div>`;
                }).join('');

                html += `<div class="api-section">
                    <div class="api-section-header" onclick="this.parentElement.classList.toggle('collapsed')">
                        <h3>${section.section}</h3>
                        <span class="count">${section.endpoints.length} endpoints</span>
                        <span class="chevron">▼</span>
                    </div>
                    <div class="api-section-body">${pathsHTML}</div>
                </div>`;
            });
            document.getElementById('cheatsheet-content').innerHTML = html;
        }

        function getSpecUrl(project) {
            // Try relative path first (for GitHub Pages), fallback to raw GitHub URL
            const basePath = window.location.pathname.replace(/\/[^/]*$/, '');
            const localPath = project === 'intranet'
                ? `${basePath}/../api/openapi-intranet.yaml`
                : `${basePath}/../api/openapi-web.yaml`;

            return project === 'intranet'
                ? 'https://raw.githubusercontent.com/DAW2ProyectoIntermodular/ProyectoIntermodular/main/docs/api/openapi-intranet.yaml'
                : 'https://raw.githubusercontent.com/DAW2ProyectoIntermodular/ProyectoIntermodular/main/docs/api/openapi-web.yaml';
        }

        function loadSwagger(project) {
            document.querySelectorAll('#swagger-api-selector button').forEach((btn, i) => {
                btn.classList.toggle('active', (project === 'intranet' ? i === 0 : i === 1));
            });

            if (swaggerUI) {
                swaggerUI = null;
                document.getElementById('swagger-ui-container').innerHTML = '';
            }

            swaggerUI = SwaggerUIBundle({
                url: getSpecUrl(project),
                dom_id: '#swagger-ui-container',
                deepLinking: true,
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
                layout: "BaseLayout",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 2,
                docExpansion: "list",
            });
        }

        function loadRedoc(project) {
            document.querySelectorAll('#redoc-api-selector button').forEach((btn, i) => {
                btn.classList.toggle('active', (project === 'intranet' ? i === 0 : i === 1));
            });

            const container = document.getElementById('redoc-container');
            container.innerHTML = '<div style="padding: 2rem; text-align: center; color: var(--color-text-secondary);">Cargando documentación Redoc...</div>';

            // Load Redoc dynamically
            if (!window.Redoc) {
                const script = document.createElement('script');
                script.src = 'https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js';
                script.onload = () => initRedoc(project);
                document.body.appendChild(script);
            } else {
                initRedoc(project);
            }
        }

        function initRedoc(project) {
            const container = document.getElementById('redoc-container');
            container.innerHTML = '';
            Redoc.init(getSpecUrl(project), {
                theme: {
                    colors: { primary: { main: '#6366f1' } },
                    typography: { fontFamily: 'Inter, sans-serif', code: { fontFamily: 'JetBrains Mono, monospace' } },
                    sidebar: { backgroundColor: '#141416', textColor: '#e8e8ed' },
                    rightPanel: { backgroundColor: '#1c1c1f' },
                },
                scrollYOffset: 80,
                hideDownloadButton: false,
            }, container);
        }

        // Init
        renderCheatsheet();
        renderStats();
    </script>
